   JUEGO
========================= */

   INFORMACION
========================= */

<script>

/* =========================
   SOCKET
========================= */

const socket = io();


/* =========================
   ELEMENTOS
========================= */

const menu =
    document.getElementById("menu");

const juego =
    document.getElementById("juego");

const crearSala =
    document.getElementById("crearSala");

const unirseSala =
    document.getElementById("unirseSala");

const codigoInput =
    document.getElementById("codigoInput");

const codigoSala =
    document.getElementById("codigoSala");

const cantidadJugadores =
    document.getElementById("cantidadJugadores");

const mapa =
    document.getElementById("mapa");

const camara =
    document.getElementById("camara");

const mensaje =
    document.getElementById("mensaje");

const habitacionActual =
    document.getElementById("habitacionActual");


/* =========================
   JUGADOR
========================= */

let miId = null;

let miJugador = {
    x: 700,
    y: 450
};

// La posición local es controlada por este navegador.
// El servidor solamente la inicializa una vez.
let posicionInicialRecibida = false;


/*
    Radio de colisión.
*/

const RADIO_JUGADOR = 18;


/* =========================
   CONEXION
========================= */

socket.on("connect", () => {

    miId = socket.id;

});


/* =========================
   CREAR SALA
========================= */

crearSala.addEventListener(
    "click",
    () => {

        socket.emit("crearSala");

    }
);


/* =========================
   UNIRSE
========================= */

unirseSala.addEventListener(
    "click",
    () => {

        const codigo =
            codigoInput.value
            .trim()
            .toUpperCase();


        if (codigo === "") {

            mensaje.textContent =
                "Escribí un código.";

            return;
        }


        socket.emit(
            "unirseSala",
            codigo
        );

    }
);


/* =========================
   ENTRAR AL JUEGO
========================= */

socket.on(
    "salaCreada",
    datos => {

        entrarAlJuego(datos);

    }
);


socket.on(
    "salaUnida",
    datos => {

        entrarAlJuego(datos);

    }
);


function entrarAlJuego(datos) {

    // Al entrar a una sala nueva permitimos que el servidor
    // entregue la posición inicial una sola vez.
    posicionInicialRecibida = false;

    menu.style.display = "none";

    juego.style.display = "block";


    if (datos && datos.codigo) {

        codigoSala.textContent =
            datos.codigo;

    }


    if (
        datos &&
        datos.jugadores !== undefined
    ) {

        cantidadJugadores.textContent =
            datos.jugadores;

    }


    actualizarCamara();

}


/* =========================
   ACTUALIZAR JUGADORES
========================= */

socket.on(
    "actualizarJugadores",
    jugadores => {

        cantidadJugadores.textContent =
            jugadores.length;

        mostrarJugadores(jugadores);

    }
);


/* =========================
   ERROR
========================= */

socket.on(
    "errorSala",
    texto => {

        mensaje.textContent = texto;

    }
);


/* =========================
   MOSTRAR JUGADORES
========================= */

function mostrarJugadores(jugadores) {

    mapa
        .querySelectorAll(".jugador")
        .forEach(jugador => {
            jugador.remove();
        });


    jugadores.forEach(
        (jugador, indice) => {

            const elemento =
                document.createElement("div");


            elemento.className =
                "jugador";


            if (jugador.id === miId) {

                elemento.classList.add(
                    "jugador1"
                );

                // Tomamos la posición del servidor solamente
                // la primera vez. Después el movimiento local
                // no debe ser sobrescrito por los mensajes de red.
                if (!posicionInicialRecibida) {

                    miJugador.x = jugador.x;
                    miJugador.y = jugador.y;

                    posicionInicialRecibida = true;
                }

            }
            else {

                elemento.classList.add(
                    "otroJugador"
                );

            }


            /* Cabeza */

            const cabeza =
                document.createElement("div");

            cabeza.className =
                "cabeza";


            /* Pelo */

            const pelo =
                document.createElement("div");

            pelo.className =
                "pelo";


            /* Cuerpo */

            const cuerpo =
                document.createElement("div");

            cuerpo.className =
                "cuerpo";


            /* Brazos */

            const brazo1 =
                document.createElement("div");

            brazo1.className =
                "brazo brazo-izquierdo";


            const brazo2 =
                document.createElement("div");

            brazo2.className =
                "brazo brazo-derecho";


            /* Piernas */

            const pierna1 =
                document.createElement("div");

            pierna1.className =
                "pierna pierna-izquierda";


            const pierna2 =
                document.createElement("div");

            pierna2.className =
                "pierna pierna-derecha";


            /* Nombre */

            const nombre =
                document.createElement("div");

            nombre.className =
                "nombreJugador";


            nombre.textContent =
                jugador.id === miId
                    ? "YO"
                    : "Jugador " +
                      (indice + 1);


            elemento.appendChild(cabeza);
            elemento.appendChild(pelo);
            elemento.appendChild(cuerpo);

            elemento.appendChild(brazo1);
            elemento.appendChild(brazo2);

            elemento.appendChild(pierna1);
            elemento.appendChild(pierna2);

            elemento.appendChild(nombre);


            elemento.style.left =
                jugador.x + "px";

            elemento.style.top =
                jugador.y + "px";


            mapa.appendChild(elemento);

        }
    );

}


/* =========================
   TECLADO
========================= */

const teclas = Object.create(null);

const teclasMovimiento = new Set([
    "w",
    "a",
    "s",
    "d"
]);


// Cuando se presiona una tecla solamente la marcamos.
// NO movemos al jugador desde keydown.
document.addEventListener(
    "keydown",
    evento => {

        const tecla =
            evento.key.toLowerCase();

        if (teclasMovimiento.has(tecla)) {
            evento.preventDefault();
            teclas[tecla] = true;
        }

    }
);


// Cuando se suelta la tecla la liberamos.
document.addEventListener(
    "keyup",
    evento => {

        const tecla =
            evento.key.toLowerCase();

        if (teclasMovimiento.has(tecla)) {
            evento.preventDefault();
            teclas[tecla] = false;
        }

    }
);


// Si la ventana pierde el foco,
// liberamos todas las teclas para evitar
// que una tecla quede "pegada".
window.addEventListener(
    "blur",
    () => {

        for (const tecla of teclasMovimiento) {
            teclas[tecla] = false;
        }

    }
);


/* =========================
   RECTANGULOS
========================= */

function rect(
    x,
    y,
    ancho,
    alto
) {

    return {
        x,
        y,
        ancho,
        alto
    };

}


/* ==================================================
   PAREDES

   IMPORTANTE:

   Acá solamente aparecen las paredes.

   NO hay paredes de los pasillos.
   NO hay zonas transitables.
   NO hay colisiones invisibles.
================================================== */

const paredes = [

    /* HABITACION 1 */

    rect(50, 50, 350, 14),

    rect(50, 336, 350, 14),

    rect(50, 50, 14, 300),

    rect(386, 50, 14, 110),

    rect(386, 240, 14, 110),


    /* HABITACION 2 */

    rect(525, 50, 350, 14),

    rect(525, 336, 350, 14),

    rect(525, 50, 14, 110),

    rect(525, 240, 14, 110),

    rect(861, 50, 14, 110),

    rect(861, 240, 14, 110),


    /* HABITACION 3 */

    rect(1050, 50, 300, 14),

    rect(1050, 336, 300, 14),

    rect(1050, 50, 14, 110),

    rect(1050, 240, 14, 110),

    rect(1336, 50, 14, 300),


    /* HABITACION 4 */

    rect(50, 500, 350, 14),

    rect(50, 836, 350, 14),

    rect(50, 500, 14, 350),

    rect(386, 500, 14, 110),

    rect(386, 690, 14, 160),


    /* HABITACION 5 */

    rect(525, 500, 350, 14),

    rect(525, 836, 350, 14),

    rect(525, 500, 14, 110),

    rect(525, 690, 14, 160),

    rect(861, 500, 14, 110),

    rect(861, 690, 14, 160),


    /* HABITACION 6 */

    rect(1050, 500, 300, 14),

    rect(1050, 836, 300, 14),

    rect(1050, 500, 14, 110),

    rect(1050, 690, 14, 160),

    rect(1336, 500, 14, 350)

];


/* =========================
   COLISION CON PARED
========================= */

function colisionaConPared(
    x,
    y,
    pared
) {

    /*
       Buscamos el punto de la
       pared más cercano al jugador.
    */

    const puntoX =
        Math.max(
            pared.x,
            Math.min(
                x,
                pared.x + pared.ancho
            )
        );


    const puntoY =
        Math.max(
            pared.y,
            Math.min(
                y,
                pared.y + pared.alto
            )
        );


    const distanciaX =
        x - puntoX;


    const distanciaY =
        y - puntoY;


    const distancia =
        Math.sqrt(
            distanciaX * distanciaX +
            distanciaY * distanciaY
        );


    return distancia < RADIO_JUGADOR;

}


/* =========================
   ¿TOCA ALGUNA PARED?
========================= */

function tocaPared(
    x,
    y
) {

    for (
        const pared of paredes
    ) {

        if (
            colisionaConPared(
                x,
                y,
                pared
            )
        ) {

            return true;

        }

    }


    return false;

}


/* =========================
   MOVIMIENTO
========================= */

function moverJugador(
    nuevoX,
    nuevoY
) {

    /*
       Primero intentamos mover
       en las dos direcciones.
    */

    if (
        !tocaPared(
            nuevoX,
            nuevoY
        )
    ) {

        miJugador.x =
            nuevoX;

        miJugador.y =
            nuevoY;

        return;

    }


    /*
       Si choca diagonalmente,
       intentamos mover solamente
       en X.
    */

    if (
        !tocaPared(
            nuevoX,
            miJugador.y
        )
    ) {

        miJugador.x =
            nuevoX;

    }


    /*
       Después intentamos solamente Y.
    */

    if (
        !tocaPared(
            miJugador.x,
            nuevoY
        )
    ) {

        miJugador.y =
            nuevoY;

    }

}


/* =========================
   MOVIMIENTO PRINCIPAL
========================= */

function actualizarMovimiento() {

    if (
        juego.style.display ===
        "none"
    ) {

        requestAnimationFrame(
            actualizarMovimiento
        );

        return;

    }


    const velocidad = 5;


    let nuevoX =
        miJugador.x;

    let nuevoY =
        miJugador.y;


    // Cada dirección se calcula una sola vez por frame.
    // Si se mantienen dos teclas opuestas, se anulan entre sí.
    const arriba = teclas["w"] === true;
    const abajo = teclas["s"] === true;
    const izquierda = teclas["a"] === true;
    const derecha = teclas["d"] === true;


    if (arriba && !abajo) {
        nuevoY -= velocidad;
    }

    if (abajo && !arriba) {
        nuevoY += velocidad;
    }

    if (izquierda && !derecha) {
        nuevoX -= velocidad;
    }

    if (derecha && !izquierda) {
        nuevoX += velocidad;
    }


    /*
       Limites exteriores del mapa.
    */

    nuevoX =
        Math.max(
            RADIO_JUGADOR,
            Math.min(
                1400 - RADIO_JUGADOR,
                nuevoX
            )
        );


    nuevoY =
        Math.max(
            RADIO_JUGADOR,
            Math.min(
                900 - RADIO_JUGADOR,
                nuevoY
            )
        );


    /*
       Mover solamente si no
       atraviesa una pared.
    */

    if (
        nuevoX !== miJugador.x ||
        nuevoY !== miJugador.y
    ) {

        moverJugador(
            nuevoX,
            nuevoY
        );


        /*
           Enviamos al servidor
           la posición actual.
        */

        socket.emit(
            "moverJugador",
            {
                x: miJugador.x,
                y: miJugador.y
            }
        );

    }


    actualizarCamara();

    actualizarHabitacion();


    requestAnimationFrame(
        actualizarMovimiento
    );

}


/* =========================
   CAMARA
========================= */

function actualizarCamara() {

    const habitacion =
        detectarHabitacion();


    /*
       Zoom solamente dentro
       de una habitación.
    */

    const zoom =
        habitacion
            ? 1.35
            : 1;


    const centroX =
        camara.clientWidth / 2;


    const centroY =
        camara.clientHeight / 2;


    let izquierda =
        centroX -
        miJugador.x * zoom;


    let arriba =
        centroY -
        miJugador.y * zoom;


    const anchoMapa =
        1400 * zoom;


    const altoMapa =
        900 * zoom;


    izquierda =
        Math.min(
            0,
            Math.max(
                camara.clientWidth -
                anchoMapa,
                izquierda
            )
        );


    arriba =
        Math.min(
            0,
            Math.max(
                camara.clientHeight -
                altoMapa,
                arriba
            )
        );


    mapa.style.left =
        izquierda + "px";


    mapa.style.top =
        arriba + "px";


    mapa.style.transform =
        `scale(${zoom})`;

}


/* =========================
   DETECTAR HABITACION
========================= */

function detectarHabitacion() {

    const x =
        miJugador.x;

    const y =
        miJugador.y;


    if (
        x >= 64 &&
        x <= 386 &&
        y >= 64 &&
        y <= 336
    ) {

        return "Sala de estar";

    }


    if (
        x >= 539 &&
        x <= 861 &&
        y >= 64 &&
        y <= 336
    ) {

        return "Cocina";

    }


    if (
        x >= 1064 &&
        x <= 1336 &&
        y >= 64 &&
        y <= 336
    ) {

        return "Dormitorio";

    }


    if (
        x >= 64 &&
        x <= 386 &&
        y >= 514 &&
        y <= 836
    ) {

        return "Biblioteca";

    }


    if (
        x >= 539 &&
        x <= 861 &&
        y >= 514 &&
        y <= 836
    ) {

        return "Sala central";

    }


    if (
        x >= 1064 &&
        x <= 1336 &&
        y >= 514 &&
        y <= 836
    ) {

        return "Sala de juegos";

    }


    return null;

}


/* =========================
   ACTUALIZAR HABITACION
========================= */

function actualizarHabitacion() {

    const habitacion =
        detectarHabitacion();


    if (habitacion) {

        habitacionActual.textContent =
            "Habitación: " +
            habitacion;

    }
    else {

        habitacionActual.textContent =
            "Pasillo";

    }

}


/* =========================
   INICIAR
========================= */

actualizarMovimiento();

</script>
