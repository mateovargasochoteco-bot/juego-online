<!-- =========================

========================= -->

<div id="menu">

    <h1>🎮 Juego Online</h1>

    <h2>Crear sala</h2>

    <button id="crearSala">
        Crear sala
    </button>

    <hr>

    <h2>Unirse</h2>

    <input
        id="codigoInput"
        maxlength="5"
        placeholder="Código de sala"
    >

    <button id="unirseSala">
        Unirse a sala
    </button>

    <p id="mensaje"></p>

</div>


<!-- =========================
     JUEGO
========================= -->

<div id="juego">

    <div id="hudEscondite">
        <div id="fasePartida">ESPERANDO JUGADORES</div>
        <div id="temporizadorPartida">--</div>
        <div id="rolPartida">Esperando que comience la partida...</div>
        <div id="mensajePartida"></div>
    </div>

    <audio id="musicaPartida" loop preload="auto"></audio>

    <div id="overlayPartida">
        <div id="panelResultado">
            <h2 id="tituloResultado">Fin de la partida</h2>
            <p id="textoResultado"></p>
            <button id="volverMenu" type="button">VOLVER AL MENÚ</button>
        </div>
    </div>


    <div id="informacion">

        <h2>
            Sala:
            <span id="codigoSala"></span>
        </h2>

        <p>
            Jugadores:
            <span id="cantidadJugadores">0</span>
            /4
        </p>

        <p>
            Usá W A S D para moverte
        </p>

    </div>


    <div id="camara">

        <div id="mapa">
            <canvas id="worldCanvas" aria-label="Mapa infinito generado mientras explorás"></canvas>
        </div>

    </div>


    <div id="habitacionActual">
        Pasillo
    </div>

</div>



<script src="/socket.io/socket.io.js"></script>

<script>
/* =========================================================
   ESCONDITE ONLINE
========================================================= */

const socket = io();

/* =========================
   ELEMENTOS
========================= */

const menu = document.getElementById("menu");
const juego = document.getElementById("juego");
const crearSala = document.getElementById("crearSala");
const unirseSala = document.getElementById("unirseSala");
const codigoInput = document.getElementById("codigoInput");
const codigoSala = document.getElementById("codigoSala");
const cantidadJugadores = document.getElementById("cantidadJugadores");
const mapa = document.getElementById("mapa");
const worldCanvas = document.getElementById("worldCanvas");
const contextoMapa = worldCanvas.getContext("2d");
const camara = document.getElementById("camara");
const mensaje = document.getElementById("mensaje");
const habitacionActual = document.getElementById("habitacionActual");

const fasePartida = document.getElementById("fasePartida");
const temporizadorPartida = document.getElementById("temporizadorPartida");
const rolPartida = document.getElementById("rolPartida");
const mensajePartida = document.getElementById("mensajePartida");
const overlayPartida = document.getElementById("overlayPartida");
const tituloResultado = document.getElementById("tituloResultado");
const textoResultado = document.getElementById("textoResultado");
const volverMenu = document.getElementById("volverMenu");
const musicaPartida = document.getElementById("musicaPartida");

/* =========================
   JUGADOR LOCAL
========================= */

let miId = null;
let posicionInicialRecibida = false;

let miJugador = {
    x: 700,
    y: 450
};

let jugadoresActuales = [];
let miRol = "esperando";
let faseActual = "esperando";
let partidaTerminada = false;

const RADIO_JUGADOR = 27;
const teclas = Object.create(null);
const teclasMovimiento = new Set(["w", "a", "s", "d"]);

const elementosJugadores = new Map();

/* Música: nombres de archivos que vos colocás en public/img/ */
const canciones = [
    "/img/gd1.mp3",
    "/img/gd2.mp3",
    "/img/gd3.mp3",
    "/img/gd4.mp3"
];

let indiceCancionActual = -1;

/* =========================
   CONEXIÓN
========================= */

socket.on("connect", () => {
    miId = socket.id;
});

/* =========================
   CREAR / UNIRSE
========================= */

crearSala.addEventListener("click", () => {
    socket.emit("crearSala");
});

unirseSala.addEventListener("click", () => {
    const codigo = codigoInput.value.trim().toUpperCase();

    if (codigo === "") {
        mensaje.textContent = "Escribí un código.";
        return;
    }

    socket.emit("unirseSala", codigo);
});

codigoInput.addEventListener("keydown", evento => {
    if (evento.key === "Enter") {
        unirseSala.click();
    }
});

/* =========================
   ENTRAR
========================= */

socket.on("salaCreada", datos => {
    entrarAlJuego(datos);
});

socket.on("salaUnida", datos => {
    entrarAlJuego(datos);
});

function entrarAlJuego(datos) {
    menu.style.display = "none";
    juego.style.display = "block";

    posicionInicialRecibida = false;
    partidaTerminada = false;

    overlayPartida.style.display = "none";

    if (datos && datos.codigo) {
        codigoSala.textContent = datos.codigo;
    }

    if (datos && datos.jugadores !== undefined) {
        cantidadJugadores.textContent = datos.jugadores;
    }

    actualizarCamara();
    renderizarMapaProcedural();
}

/* =========================
   ESTADO DE PARTIDA
========================= */

   
socket.on("estadoSala", (estado) => {
    if (!estado) return;

    const hudEscondite = document.getElementById("hudEscondite");

    if (estado.cantidad !== undefined) {
        cantidadJugadores.textContent = estado.cantidad;
    }

    // Ocultar el panel negro mientras se espera si ya están los 4.
    // Si alguien se desconecta, vuelve a aparecer.
    if (hudEscondite) {
        const salaCompleta = estado.completa === true ||
            Number(estado.cantidad) >= 4;

        hudEscondite.style.display =
            salaCompleta && faseActual === "esperando" ? "none" : "";
    }
});

socket.on("estadoPartida", estado => {
    if (!estado) return;

    faseActual = estado.fase || "esperando";
    miRol = estado.miRol || "esperando";

    if (estado.jugadores !== undefined) {
        cantidadJugadores.textContent = estado.jugadores;
    }

    // Volver a mostrar el HUD cuando comience la cuenta o la búsqueda.
    // Durante la espera, ocultarlo solamente si hay 4 jugadores.
    const hudEscondite = document.getElementById("hudEscondite");
    if (hudEscondite) {
        const hayCuatroJugadores = jugadoresActuales.length >= 4 ||
            Number(estado.jugadores) >= 4;

        hudEscondite.style.display =
            faseActual === "esperando" && hayCuatroJugadores ? "none" : "";
    }

    actualizarHUD(estado);

    if (estado.fase === "fin") {
        mostrarResultado(estado);
    }
});

function actualizarHUD(estado) {
    const tiempo = Number.isFinite(estado.tiempo)
        ? Math.max(0, Math.ceil(estado.tiempo))
        : 0;

    temporizadorPartida.textContent =
        estado.fase === "esperando" ? "--" : tiempo;

    if (estado.fase === "cuenta") {
        fasePartida.textContent = "EL BUSCADOR CUENTA";

        rolPartida.textContent =
            miRol === "buscador"
                ? "Sos el BUSCADOR. Podés moverte mientras contás."
                : "Sos ESCONDIDO. ¡Buscá un lugar para esconderte!";

        mensajePartida.textContent =
            "El buscador está contando...";
    }
    else if (estado.fase === "busqueda") {
        fasePartida.textContent = "¡A BUSCAR!";

        rolPartida.textContent =
            miRol === "buscador"
                ? "Sos el BUSCADOR. Encontrá a los demás."
                : "Sos ESCONDIDO. ¡No dejes que te encuentren!";

        mensajePartida.textContent =
            "El buscador tiene una vista más reducida.";
    }
    else if (estado.fase === "fin") {
        fasePartida.textContent = "PARTIDA TERMINADA";
    }
    else {
        fasePartida.textContent = "ESPERANDO JUGADORES";
        rolPartida.textContent = "Se necesitan al menos 2 jugadores.";
        mensajePartida.textContent = "";
    }

    actualizarCamara();
}

/* =========================
   MÚSICA
========================= */

socket.on("musicaPartida", datos => {
    if (!datos || !Number.isInteger(datos.indice)) return;

    const indice = datos.indice % canciones.length;

    if (indice === indiceCancionActual) return;

    indiceCancionActual = indice;
    musicaPartida.src = canciones[indice];

    musicaPartida.currentTime = 0;

    const promesa = musicaPartida.play();

    if (promesa && typeof promesa.catch === "function") {
        promesa.catch(() => {
            // Algunos navegadores bloquean el audio si no hubo interacción.
        });
    }
});

function detenerMusica() {
    musicaPartida.pause();
    musicaPartida.currentTime = 0;
}

/* =========================
   JUGADORES
========================= */

socket.on("actualizarJugadores", jugadores => {
    jugadoresActuales = Array.isArray(jugadores) ? jugadores : [];

    cantidadJugadores.textContent = jugadoresActuales.length;

    actualizarJugadoresDOM();
});

function actualizarJugadoresDOM() {
    for (const jugador of jugadoresActuales) {
        if (jugador.id === miId && !posicionInicialRecibida) {
            miJugador.x = jugador.x;
            miJugador.y = jugador.y;
            posicionInicialRecibida = true;
        }
    }
    renderizarMapaProcedural();
}

function crearElementoJugador() {
    // Los jugadores se dibujan directamente en el canvas del mundo.
    return null;
}

function renderizarJugadorLocal() {
    renderizarMapaProcedural();
}

/* =========================
   ERROR
========================= */

socket.on("errorSala", texto => {
    mensaje.textContent = texto;
});

/* =========================
   TECLADO
========================= */

document.addEventListener("keydown", evento => {
    const tecla = evento.key.toLowerCase();

    if (teclasMovimiento.has(tecla)) {
        evento.preventDefault();
        teclas[tecla] = true;
    }
});

document.addEventListener("keyup", evento => {
    const tecla = evento.key.toLowerCase();

    if (teclasMovimiento.has(tecla)) {
        evento.preventDefault();
        teclas[tecla] = false;
    }
});

window.addEventListener("blur", () => {
    for (const tecla of teclasMovimiento) {
        teclas[tecla] = false;
    }
});

/* =========================================================
   MAPA PROCEDURAL INFINITO
   Las habitaciones se generan por coordenadas. La misma coordenada
   siempre produce la misma habitación, así todos ven el mismo mundo.
========================================================= */

const TAM_CELDA = 500;
const TAM_HABITACION = 360;
const GROSOR_PARED = 14;
const ANCHO_PUERTA = 86;
let zoomCamara = 1;
let ultimoAnchoCanvas = 0;
let ultimoAltoCanvas = 0;

function hashCelda(gx, gy, extra = 0) {
    let n = Math.imul(gx | 0, 374761393) + Math.imul(gy | 0, 668265263) + Math.imul(extra | 0, 1442695041);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return (n ^ (n >>> 16)) >>> 0;
}

function aleatorioCelda(gx, gy, extra = 0) {
    return hashCelda(gx, gy, extra) / 4294967295;
}

function rect(x, y, ancho, alto) {
    return { x, y, ancho, alto };
}

function obtenerHabitacion(gx, gy) {
    const nombres = ["Sala de estar", "Cocina", "Biblioteca", "Dormitorio", "Sala de juegos", "Sala central", "Depósito", "Laboratorio", "Comedor", "Sala abandonada"];
    const estilos = ["#77736b", "#777b70", "#74717d", "#82766d", "#6e797d", "#777777"];
    const semilla = hashCelda(gx, gy);
    const mitad = TAM_HABITACION / 2;
    const cx = gx * TAM_CELDA;
    const cy = gy * TAM_CELDA;
    const muebles = [];
    // Cada habitación puede tener cero, uno o dos muebles; se generan de forma estable.
    const cantidad = hashCelda(gx, gy, 5) % 3;
    for (let i = 0; i < cantidad; i++) {
        const ancho = 42 + (hashCelda(gx, gy, 10 + i) % 36);
        const alto = 34 + (hashCelda(gx, gy, 20 + i) % 30);
        const mx = cx - 115 + (hashCelda(gx, gy, 30 + i) % 190);
        const my = cy - 115 + (hashCelda(gx, gy, 40 + i) % 190);
        // Mantener libre el centro de la habitación para evitar apariciones atrapadas.
        if (Math.abs(mx - cx) < 75 && Math.abs(my - cy) < 75) continue;
        muebles.push(rect(mx, my, ancho, alto));
    }
    return {
        gx, gy, cx, cy,
        x: cx - mitad, y: cy - mitad,
        ancho: TAM_HABITACION, alto: TAM_HABITACION,
        nombre: nombres[semilla % nombres.length],
        color: estilos[(semilla >>> 5) % estilos.length],
        muebles
    };
}

function paredesDeHabitacion(h) {
    const x = h.x, y = h.y, w = h.ancho, t = GROSOR_PARED;
    const g = ANCHO_PUERTA / 2;
    const cx = h.cx, cy = h.cy;
    // Las paredes tienen huecos centrados que actúan como puertas.
    return [
        rect(x, y, (w / 2) - g, t),
        rect(cx + g, y, (w / 2) - g, t),
        rect(x, y + h.alto - t, (w / 2) - g, t),
        rect(cx + g, y + h.alto - t, (w / 2) - g, t),
        rect(x, y, t, (h.alto / 2) - g),
        rect(x, cy + g, t, (h.alto / 2) - g),
        rect(x + w - t, y, t, (h.alto / 2) - g),
        rect(x + w - t, cy + g, t, (h.alto / 2) - g)
    ];
}

function distanciaPuntoRect(x, y, r) {
    const px = Math.max(r.x, Math.min(x, r.x + r.ancho));
    const py = Math.max(r.y, Math.min(y, r.y + r.alto));
    return Math.hypot(x - px, y - py);
}

function tocaPared(x, y) {
    const gx = Math.floor(x / TAM_CELDA);
    const gy = Math.floor(y / TAM_CELDA);
    for (let ix = gx - 1; ix <= gx + 1; ix++) {
        for (let iy = gy - 1; iy <= gy + 1; iy++) {
            const h = obtenerHabitacion(ix, iy);
            for (const pared of paredesDeHabitacion(h)) {
                if (distanciaPuntoRect(x, y, pared) < RADIO_JUGADOR) return true;
            }
            for (const mueble of h.muebles) {
                if (distanciaPuntoRect(x, y, mueble) < RADIO_JUGADOR) return true;
            }
        }
    }
    return false;
}

function moverJugador(nuevoX, nuevoY) {
    if (!tocaPared(nuevoX, nuevoY)) {
        miJugador.x = nuevoX;
        miJugador.y = nuevoY;
        return;
    }
    if (!tocaPared(nuevoX, miJugador.y)) miJugador.x = nuevoX;
    if (!tocaPared(miJugador.x, nuevoY)) miJugador.y = nuevoY;
}

function ajustarCanvas() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const ancho = camara.clientWidth;
    const alto = camara.clientHeight;
    if (ancho !== ultimoAnchoCanvas || alto !== ultimoAltoCanvas || worldCanvas.width !== Math.round(ancho * dpr) || worldCanvas.height !== Math.round(alto * dpr)) {
        ultimoAnchoCanvas = ancho;
        ultimoAltoCanvas = alto;
        worldCanvas.width = Math.round(ancho * dpr);
        worldCanvas.height = Math.round(alto * dpr);
        contextoMapa.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
}

function dibujarRectMundo(r, color, borde = null) {
    const ancho = camara.clientWidth;
    const alto = camara.clientHeight;
    const sx = (r.x - miJugador.x) * zoomCamara + ancho / 2;
    const sy = (r.y - miJugador.y) * zoomCamara + alto / 2;
    contextoMapa.fillStyle = color;
    contextoMapa.fillRect(sx, sy, r.ancho * zoomCamara, r.alto * zoomCamara);
    if (borde) {
        contextoMapa.strokeStyle = borde;
        contextoMapa.lineWidth = Math.max(1, zoomCamara * 2);
        contextoMapa.strokeRect(sx, sy, r.ancho * zoomCamara, r.alto * zoomCamara);
    }
}

function renderizarMapaProcedural() {
    if (!worldCanvas || !contextoMapa || !camara || juego.style.display === "none") return;
    ajustarCanvas();
    const ancho = camara.clientWidth;
    const alto = camara.clientHeight;
    contextoMapa.clearRect(0, 0, ancho, alto);
    contextoMapa.fillStyle = "#353535";
    contextoMapa.fillRect(0, 0, ancho, alto);

    const margenX = ancho / zoomCamara / 2 + TAM_CELDA;
    const margenY = alto / zoomCamara / 2 + TAM_CELDA;
    const minGX = Math.floor((miJugador.x - margenX) / TAM_CELDA);
    const maxGX = Math.ceil((miJugador.x + margenX) / TAM_CELDA);
    const minGY = Math.floor((miJugador.y - margenY) / TAM_CELDA);
    const maxGY = Math.ceil((miJugador.y + margenY) / TAM_CELDA);
    const habitaciones = [];

    // Solo se crean/dibujan las habitaciones alrededor de la cámara.
    for (let gx = minGX; gx <= maxGX; gx++) {
        for (let gy = minGY; gy <= maxGY; gy++) {
            const h = obtenerHabitacion(gx, gy);
            habitaciones.push(h);
            dibujarRectMundo(rect(h.x, h.y, h.ancho, h.alto), h.color, "#514d49");
            // Patrón de suelo distinto pero determinista por habitación.
            contextoMapa.strokeStyle = "rgba(20,20,20,.13)";
            contextoMapa.lineWidth = 1;
            const sx = (h.x - miJugador.x) * zoomCamara + ancho / 2;
            const sy = (h.y - miJugador.y) * zoomCamara + alto / 2;
            for (let k = 1; k < 5; k++) {
                contextoMapa.beginPath();
                contextoMapa.moveTo(sx + k * h.ancho * zoomCamara / 5, sy);
                contextoMapa.lineTo(sx + k * h.ancho * zoomCamara / 5, sy + h.alto * zoomCamara);
                contextoMapa.stroke();
            }
            contextoMapa.fillStyle = "rgba(255,255,255,.55)";
            contextoMapa.font = `${Math.max(10, 12 * zoomCamara)}px Arial`;
            contextoMapa.textAlign = "center";
            contextoMapa.fillText(h.nombre, (h.cx - miJugador.x) * zoomCamara + ancho / 2, (h.y - miJugador.y) * zoomCamara + 25 * zoomCamara);
            for (const m of h.muebles) {
                dibujarRectMundo(m, "#4b3829", "#30251c");
                const tapa = rect(m.x + 5, m.y + 5, Math.max(4, m.ancho - 10), Math.max(4, m.alto - 10));
                dibujarRectMundo(tapa, "#75583f");
            }
        }
    }

    for (const h of habitaciones) {
        for (const pared of paredesDeHabitacion(h)) {
            dibujarRectMundo(pared, "#171717", "#090909");
        }
        // Pequeños umbrales claros en las puertas para que se noten los accesos.
        const g = ANCHO_PUERTA / 2;
        dibujarRectMundo(rect(h.cx - g, h.y - 2, ANCHO_PUERTA, 4), "#b69b70");
        dibujarRectMundo(rect(h.cx - g, h.y + h.alto - 2, ANCHO_PUERTA, 4), "#b69b70");
        dibujarRectMundo(rect(h.x - 2, h.cy - g, 4, ANCHO_PUERTA), "#b69b70");
        dibujarRectMundo(rect(h.x + h.ancho - 2, h.cy - g, 4, ANCHO_PUERTA), "#b69b70");
    }

    // Los jugadores se dibujan en coordenadas del mundo, no como elementos HTML.
    for (const jugador of jugadoresActuales) {
        const sx = (jugador.x - miJugador.x) * zoomCamara + ancho / 2;
        const sy = (jugador.y - miJugador.y) * zoomCamara + alto / 2;
        const esYo = jugador.id === miId;
        contextoMapa.beginPath();
        contextoMapa.arc(sx, sy, (esYo ? 17 : 15) * zoomCamara, 0, Math.PI * 2);
        contextoMapa.fillStyle = jugador.atrapado ? "#888" : (esYo ? "#4ee66b" : (jugador.rol === "buscador" ? "#ff4747" : "#4ba3ff"));
        contextoMapa.fill();
        contextoMapa.strokeStyle = "#101010";
        contextoMapa.lineWidth = 3;
        contextoMapa.stroke();
        contextoMapa.fillStyle = "#fff";
        contextoMapa.font = `bold ${Math.max(10, 12 * zoomCamara)}px Arial`;
        contextoMapa.textAlign = "center";
        const etiqueta = esYo ? "YO" : (jugador.rol === "buscador" ? "BUSCADOR" : (jugador.atrapado ? "ATRAPADO" : "ESCONDIDO"));
        contextoMapa.fillText(etiqueta, sx, sy - 22 * zoomCamara);
    }
}

function actualizarMovimiento() {
    if (juego.style.display === "none") {
        requestAnimationFrame(actualizarMovimiento);
        return;
    }
    const velocidad = 5;
    const fasePermiteMovimiento = faseActual === "cuenta" || faseActual === "busqueda";
    if (fasePermiteMovimiento && !partidaTerminada) {
        let nuevoX = miJugador.x;
        let nuevoY = miJugador.y;
        const arriba = teclas["w"] === true;
        const abajo = teclas["s"] === true;
        const izquierda = teclas["a"] === true;
        const derecha = teclas["d"] === true;
        if (arriba && !abajo) nuevoY -= velocidad;
        if (abajo && !arriba) nuevoY += velocidad;
        if (izquierda && !derecha) nuevoX -= velocidad;
        if (derecha && !izquierda) nuevoX += velocidad;
        if (nuevoX !== miJugador.x || nuevoY !== miJugador.y) {
            const anteriorX = miJugador.x, anteriorY = miJugador.y;
            moverJugador(nuevoX, nuevoY);
            if (miJugador.x !== anteriorX || miJugador.y !== anteriorY) {
                socket.emit("moverJugador", { x: miJugador.x, y: miJugador.y });
            }
        }
    }
    actualizarCamara();
    actualizarHabitacion();
    renderizarMapaProcedural();
    requestAnimationFrame(actualizarMovimiento);
}

function actualizarCamara() {
    if (!camara || !miJugador) return;
    if (miRol === "buscador" && faseActual === "busqueda") {
        zoomCamara = 1.8;
    } else {
        zoomCamara = 1;
    }
    renderizarMapaProcedural();
}

function detectarHabitacion() {
    const gx = Math.round(miJugador.x / TAM_CELDA);
    const gy = Math.round(miJugador.y / TAM_CELDA);
    const h = obtenerHabitacion(gx, gy);
    const dentro = Math.abs(miJugador.x - h.cx) <= TAM_HABITACION / 2 && Math.abs(miJugador.y - h.cy) <= TAM_HABITACION / 2;
    return dentro ? h.nombre : null;
}

function actualizarHabitacion() {
    const habitacion = detectarHabitacion();
    habitacionActual.textContent = habitacion ? "Habitación: " + habitacion : "Pasillo entre habitaciones";
}

window.addEventListener("resize", () => {
    ajustarCanvas();
    renderizarMapaProcedural();
});

/* =========================
   RESULTADO
========================= */

function mostrarResultado(estado) {
    if (partidaTerminada) return;

    partidaTerminada = true;
    detenerMusica();

    tituloResultado.textContent =
        estado.ganador === "buscador"
            ? "¡EL BUSCADOR GANÓ!"
            : "¡LOS ESCONDIDOS GANARON!";

    textoResultado.textContent =
        estado.mensajeFinal ||
        "La partida terminó.";

    overlayPartida.style.display = "flex";
}

volverMenu.addEventListener("click", () => {
    location.reload();
});

/* =========================
   INICIAR
========================= */

actualizarMovimiento();
</script>
