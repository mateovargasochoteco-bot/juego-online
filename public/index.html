<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escondite multijugador</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #10151c;
            color: white;
            font-family: Arial, sans-serif;
        }

        button, input {
            font: inherit;
        }

        #menu {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            background: linear-gradient(135deg, #111827, #263849);
        }

        #menu h1 {
            color: #ffcc44;
            text-align: center;
            font-size: clamp(28px, 5vw, 52px);
            margin: 0 0 10px;
        }

        #menu input {
            width: min(320px, 90vw);
            padding: 12px;
            border: 2px solid #718096;
            border-radius: 8px;
            background: #fff;
            color: #111;
        }

        #menu button {
            width: min(320px, 90vw);
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #e85d04;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #menu button:hover {
            background: #ff7900;
        }

        #mensaje-menu {
            max-width: 340px;
            text-align: center;
            color: #ffe8a3;
            line-height: 1.4;
        }

        #juego {
            display: none;
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #18231e;
        }

        #interfaz {
            position: absolute;
            z-index: 30;
            top: 0;
            left: 0;
            right: 0;
            min-height: 65px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.82);
            border-bottom: 2px solid #e85d04;
        }

        #estado, #reloj, #sala-info {
            font-weight: bold;
        }

        #reloj {
            color: #ffcc44;
            font-size: 22px;
        }

        #area {
            position: absolute;
            inset: 65px 0 0;
            overflow: hidden;
            background: #26372b;
        }

        #mundo {
            position: absolute;
            left: 0;
            top: 0;
            width: 2050px;
            height: 1700px;
            overflow: hidden;
            background-color: #35483a;
            background-image:
                radial-gradient(#405744 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            will-change: left, top;
        }

        .habitacion {
            position: absolute;
            width: 560px;
            height: 440px;
            background-color: #776c58;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent 0 48px,
                    rgba(0, 0, 0, 0.10) 49px 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent 0 48px,
                    rgba(0, 0, 0, 0.10) 49px 51px
                );
            box-shadow: inset 0 0 0 5px #4a3c2b;
        }

        .nombre-habitacion {
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff1d0;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #222;
            pointer-events: none;
        }

        .pared {
            position: absolute;
            background: #30271f;
            border: 2px solid #171411;
            z-index: 3;
        }

        .mueble {
            position: absolute;
            z-index: 2;
            background: #483326;
            border: 4px solid #24180f;
            border-radius: 4px;
            pointer-events: none;
        }

        .jugador {
            position: absolute;
            width: 34px;
            height: 48px;
            z-index: 10;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .cabeza {
            position: absolute;
            top: 0;
            left: 8px;
            width: 19px;
            height: 19px;
            background: #f0c39a;
            border: 2px solid #38251c;
            border-radius: 50%;
            z-index: 3;
        }

        .pelo {
            position: absolute;
            top: -1px;
            left: 7px;
            width: 21px;
            height: 8px;
            background: #26201c;
            border-radius: 8px 8px 2px 2px;
            z-index: 4;
        }

        .cuerpo {
            position: absolute;
            top: 17px;
            left: 6px;
            width: 23px;
            height: 20px;
            background: #e85d04;
            border: 2px solid #2a1b14;
            border-radius: 5px;
        }

        .brazo {
            position: absolute;
            top: 19px;
            width: 7px;
            height: 19px;
            background: #f0c39a;
            border: 1px solid #38251c;
            border-radius: 4px;
        }

        .brazo.izquierdo {
            left: 1px;
            transform: rotate(12deg);
        }

        .brazo.derecho {
            right: 1px;
            transform: rotate(-12deg);
        }

        .pierna {
            position: absolute;
            top: 34px;
            width: 9px;
            height: 14px;
            background: #202d43;
            border: 1px solid #111;
            border-radius: 2px;
        }

        .pierna.izquierda {
            left: 8px;
        }

        .pierna.derecha {
            right: 8px;
        }

        .nombre-jugador {
            position: absolute;
            bottom: 49px;
            left: 50%;
            transform: translateX(-50%);
            padding: 3px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .jugador.propio .cuerpo {
            background: #00b4d8;
        }

        .jugador.buscador .cuerpo {
            background: #d00000;
        }

        .jugador.atrapado {
            opacity: 0.35;
            filter: grayscale(1);
        }

        #oscuridad {
            position: absolute;
            z-index: 20;
            inset: 0;
            pointer-events: none;
            display: none;
            background: radial-gradient(
                circle 250px at 50% 50%,
                transparent 0 65%,
                rgba(0, 0, 0, 0.96) 100%
            );
        }

        #minimapa {
            position: absolute;
            z-index: 25;
            right: 12px;
            bottom: 12px;
            width: 170px;
            height: 140px;
            border: 2px solid white;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.8);
        }

        #controles {
            position: absolute;
            z-index: 26;
            left: 12px;
            bottom: 12px;
            padding: 10px;
            max-width: 230px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 13px;
            line-height: 1.5;
        }

        #resultado {
            position: absolute;
            z-index: 50;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            background: rgba(0, 0, 0, 0.86);
            text-align: center;
            padding: 20px;
        }

        #resultado h2 {
            color: #ffcc44;
            font-size: clamp(28px, 5vw, 48px);
            margin: 0;
        }

        #resultado button {
            border: 0;
            border-radius: 8px;
            padding: 12px 22px;
            background: #e85d04;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            #interfaz {
                font-size: 12px;
            }

            #reloj {
                font-size: 17px;
            }

            #minimapa {
                width: 120px;
                height: 100px;
            }

            #controles {
                max-width: 175px;
                font-size: 11px;
            }

            #oscuridad {
                background: radial-gradient(
                    circle 190px at 50% 50%,
                    transparent 0 60%,
                    rgba(0, 0, 0, 0.97) 100%
                );
            }
        }
    </style>
</head>

<body>
    <div id="menu">
        <h1>ESCONDITE ONLINE</h1>

        <input id="nombre" maxlength="16" placeholder="Tu nombre">

        <button id="crear">Crear sala</button>

        <input id="codigo" maxlength="5" placeholder="Código de sala">

        <button id="unirse">Unirse a una sala</button>

        <p id="mensaje-menu">
            Se necesitan 4 jugadores. El buscador tendrá 15 segundos
            para contar y luego 100 segundos para encontrar a todos.
        </p>
    </div>

    <div id="juego">
        <div id="interfaz">
            <div id="sala-info">Sala: ---</div>
            <div id="estado">Esperando jugadores...</div>
            <div id="reloj">--</div>
        </div>

        <div id="area">
            <div id="mundo"></div>
            <div id="oscuridad"></div>

            <canvas id="minimapa" width="340" height="280"></canvas>

            <div id="controles">
                <b>Controles</b><br>
                W A S D o flechas: moverse<br>
                El buscador tiene visión limitada.
            </div>
        </div>

        <div id="resultado">
            <h2 id="texto-resultado">Fin de la partida</h2>
            <p id="detalle-resultado"></p>
            <button onclick="location.reload()">Volver al menú</button>
        </div>
    </div>

    <audio id="musica" loop></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const menu = document.getElementById("menu");
        const juego = document.getElementById("juego");
        const area = document.getElementById("area");
        const mundo = document.getElementById("mundo");
        const oscuridad = document.getElementById("oscuridad");
        const estado = document.getElementById("estado");
        const reloj = document.getElementById("reloj");
        const salaInfo = document.getElementById("sala-info");
        const mensajeMenu = document.getElementById("mensaje-menu");
        const resultado = document.getElementById("resultado");
        const musica = document.getElementById("musica");
        const minimapa = document.getElementById("minimapa");
        const ctx = minimapa.getContext("2d");

        const ANCHO_MAPA = 2050;
        const ALTO_MAPA = 1700;
        const ANCHO_HAB = 560;
        const ALTO_HAB = 440;
        const PASO = 680;
        const FILA = 560;
        const GROSOR_PARED = 14;
        const ANCHO_PUERTA = 100;

        let codigoSala = "";
        let miId = "";
        let jugadores = [];
        let fase = "esperando";
        let tiempoRestante = 0;
        let rol = "";
        let posicion = { x: 120, y: 120 };
        let teclas = {};
        let ultimoEnvio = 0;
        let finPartida = false;

        const elementosJugadores = new Map();
        const paredes = [];

        const habitaciones = [
            "Sala de estar", "Cocina", "Dormitorio",
            "Biblioteca", "Sala central", "Sala de juegos",
            "Habitación 7", "Habitación 8", "Habitación 9"
        ];

        function crearPared(x, y, ancho, alto) {
            const pared = document.createElement("div");
            pared.className = "pared";
            pared.style.left = x + "px";
            pared.style.top = y + "px";
            pared.style.width = ancho + "px";
            pared.style.height = alto + "px";
            mundo.appendChild(pared);

            paredes.push({
                x, y, ancho, alto
            });
        }

        function crearTramoHorizontal(x1, x2, y) {
            if (x2 <= x1) return;
            crearPared(x1, y, x2 - x1, GROSOR_PARED);
        }

        function crearTramoVertical(y1, y2, x) {
            if (y2 <= y1) return;
            crearPared(x, y1, GROSOR_PARED, y2 - y1);
        }

        function crearHabitacion(fila, columna, indice) {
            const x = 50 + columna * PASO;
            const y = 50 + fila * FILA;

            const habitacion = document.createElement("div");
            habitacion.className = "habitacion";
            habitacion.style.left = x + "px";
            habitacion.style.top = y + "px";

            const titulo = document.createElement("div");
            titulo.className = "nombre-habitacion";
            titulo.textContent = habitaciones[indice];
            habitacion.appendChild(titulo);

            mundo.appendChild(habitacion);

            const centroX = x + ANCHO_HAB / 2;
            const centroY = y + ALTO_HAB / 2;
            const mitadPuerta = ANCHO_PUERTA / 2;

            // Pared superior: puerta si hay otra habitación arriba.
            if (fila > 0) {
                crearTramoHorizontal(x, centroX - mitadPuerta, y);
                crearTramoHorizontal(centroX + mitadPuerta, x + ANCHO_HAB, y);
            } else {
                crearTramoHorizontal(x, x + ANCHO_HAB, y);
            }

            // Pared inferior: puerta si hay otra habitación abajo.
            if (fila < 2) {
                crearTramoHorizontal(x, centroX - mitadPuerta, y + ALTO_HAB - GROSOR_PARED);
                crearTramoHorizontal(centroX + mitadPuerta, x + ANCHO_HAB, y + ALTO_HAB - GROSOR_PARED);
            } else {
                crearTramoHorizontal(x, x + ANCHO_HAB, y + ALTO_HAB - GROSOR_PARED);
            }

            // Pared izquierda.
            if (columna > 0) {
                crearTramoVertical(y, centroY - mitadPuerta, x);
                crearTramoVertical(centroY + mitadPuerta, y + ALTO_HAB, x);
            } else {
                crearTramoVertical(y, y + ALTO_HAB, x);
            }

            // Pared derecha.
            if (columna < 2) {
                crearTramoVertical(y, centroY - mitadPuerta, x + ANCHO_HAB - GROSOR_PARED);
                crearTramoVertical(centroY + mitadPuerta, y + ALTO_HAB, x + ANCHO_HAB - GROSOR_PARED);
            } else {
                crearTramoVertical(y, y + ALTO_HAB, x + ANCHO_HAB - GROSOR_PARED);
            }

            // Muebles decorativos; no bloquean el movimiento.
            const muebles = [
                { dx: 70, dy: 90, w: 90, h: 45 },
                { dx: 370, dy: 270, w: 110, h: 50 }
            ];

            muebles.forEach(m => {
                const el = document.createElement("div");
                el.className = "mueble";
                el.style.left = (x + m.dx) + "px";
                el.style.top = (y + m.dy) + "px";
                el.style.width = m.w + "px";
                el.style.height = m.h + "px";
                mundo.appendChild(el);
            });
        }

        function crearMapa() {
            mundo.innerHTML = "";
            paredes.length = 0;

            for (let fila = 0; fila < 3; fila++) {
                for (let columna = 0; columna < 3; columna++) {
                    crearHabitacion(
                        fila,
                        columna,
                        fila * 3 + columna
                    );
                }
            }
        }

        function colisiona(x, y) {
            const radio = 15;

            if (
                x - radio < 0 ||
                y - radio < 0 ||
                x + radio > ANCHO_MAPA ||
                y + radio > ALTO_MAPA
            ) {
                return true;
            }

            return paredes.some(p => {
                return (
                    x + radio > p.x &&
                    x - radio < p.x + p.ancho &&
                    y + radio > p.y &&
                    y - radio < p.y + p.alto
                );
            });
        }

        function crearJugadorElemento(jugador) {
            const el = document.createElement("div");
            el.className = "jugador";
            el.dataset.id = jugador.id;

            el.innerHTML = `
                <div class="nombre-jugador"></div>
                <div class="pelo"></div>
                <div class="cabeza"></div>
                <div class="cuerpo"></div>
                <div class="brazo izquierdo"></div>
                <div class="brazo derecho"></div>
                <div class="pierna izquierda"></div>
                <div class="pierna derecha"></div>
            `;

            mundo.appendChild(el);
            elementosJugadores.set(jugador.id, el);
            return el;
        }

        function distancia(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function actualizarJugadores() {
            const yo = jugadores.find(j => j.id === miId);
            if (yo) {
                posicion.x = yo.x;
                posicion.y = yo.y;
                rol = yo.rol;
            }

            const visibles = new Set();

            jugadores.forEach(j => {
                const atrapado = j.atrapado === true;

                // El buscador solo ve a los escondidos dentro de su radio.
                if (
                    rol === "buscador" &&
                    j.rol === "escondido" &&
                    !atrapado &&
                    distancia(posicion, j) > 280
                ) {
                    return;
                }

                visibles.add(j.id);

                let el = elementosJugadores.get(j.id);
                if (!el) el = crearJugadorElemento(j);

                el.style.left = j.x + "px";
                el.style.top = j.y + "px";
                el.classList.toggle("propio", j.id === miId);
                el.classList.toggle("buscador", j.rol === "buscador");
                el.classList.toggle("atrapado", atrapado);

                el.querySelector(".nombre-jugador").textContent =
                    j.nombre + (atrapado ? " (atrapado)" : "");
            });

            for (const [id, el] of elementosJugadores) {
                if (!visibles.has(id)) {
                    el.remove();
                    elementosJugadores.delete(id);
                }
            }

            oscuridad.style.display =
                rol === "buscador" && fase === "buscando" ? "block" : "none";

            dibujarMinimapa();
            moverCamara();
        }

        function moverCamara() {
            const ancho = area.clientWidth;
            const alto = area.clientHeight;

            const camX = Math.max(
                0,
                Math.min(ANCHO_MAPA - ancho, posicion.x - ancho / 2)
            );

            const camY = Math.max(
                0,
                Math.min(ALTO_MAPA - alto, posicion.y - alto / 2)
            );

            mundo.style.left = -camX + "px";
            mundo.style.top = -camY + "px";
        }

        function dibujarMinimapa() {
            const w = minimapa.width;
            const h = minimapa.height;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#26372b";
            ctx.fillRect(0, 0, w, h);

            const sx = w / ANCHO_MAPA;
            const sy = h / ALTO_MAPA;

            for (let fila = 0; fila < 3; fila++) {
                for (let columna = 0; columna < 3; columna++) {
                    ctx.fillStyle = "#8a7b62";
                    ctx.fillRect(
                        (50 + columna * PASO) * sx,
                        (50 + fila * FILA) * sy,
                        ANCHO_HAB * sx,
                        ALTO_HAB * sy
                    );
                }
            }

            // Por privacidad, el buscador no ve a los escondidos en el minimapa.
            jugadores.forEach(j => {
                if (
                    rol === "buscador" &&
                    j.rol === "escondido" &&
                    !j.atrapado &&
                    distancia(posicion, j) > 280
                ) {
                    return;
                }

                ctx.fillStyle = j.id === miId
                    ? "#00d9ff"
                    : j.rol === "buscador"
                        ? "#ff3030"
                        : j.atrapado
                            ? "#999999"
                            : "#ffee55";

                ctx.beginPath();
                ctx.arc(j.x * sx, j.y * sy, 5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function reproducirMusica(nombreArchivo) {
            if (!nombreArchivo) return;

            musica.src = nombreArchivo;
            musica.volume = 0.35;
            musica.play().catch(() => {
                // Algunos navegadores esperan una interacción del usuario.
            });
        }

        function entrarAlJuego(codigo) {
            codigoSala = codigo;
            menu.style.display = "none";
            juego.style.display = "block";
            salaInfo.textContent = "Sala: " + codigo;
            crearMapa();
            moverCamara();
        }

        document.getElementById("crear").addEventListener("click", () => {
            const nombre = document.getElementById("nombre").value.trim();

            if (!nombre) {
                mensajeMenu.textContent = "Escribí tu nombre antes de crear la sala.";
                return;
            }

            socket.emit("crearSala", { nombre }, respuesta => {
                if (!respuesta || !respuesta.ok) {
                    mensajeMenu.textContent =
                        respuesta?.mensaje || "No se pudo crear la sala.";
                    return;
                }

                miId = socket.id;
                entrarAlJuego(respuesta.codigo);
            });
        });

        document.getElementById("unirse").addEventListener("click", () => {
            const nombre = document.getElementById("nombre").value.trim();
            const codigo = document.getElementById("codigo").value.trim().toUpperCase();

            if (!nombre || !codigo) {
                mensajeMenu.textContent = "Ingresá tu nombre y el código de sala.";
                return;
            }

            socket.emit("unirseSala", { nombre, codigo }, respuesta => {
                if (!respuesta || !respuesta.ok) {
                    mensajeMenu.textContent =
                        respuesta?.mensaje || "No se pudo entrar a la sala.";
                    return;
                }

                miId = socket.id;
                entrarAlJuego(respuesta.codigo);
            });
        });

        socket.on("estadoSala", datos => {
            jugadores = datos.jugadores || [];
            fase = datos.fase || "esperando";
            tiempoRestante = datos.tiempoRestante ?? 0;

            estado.textContent = datos.mensaje || "Esperando jugadores...";
            reloj.textContent = fase === "esperando"
                ? jugadores.length + "/4 jugadores"
                : tiempoRestante + " s";

            if (datos.musica) {
                reproducirMusica(datos.musica);
            }

            actualizarJugadores();
        });

        socket.on("finPartida", datos => {
            finPartida = true;
            fase = "terminada";
            resultado.style.display = "flex";
            document.getElementById("texto-resultado").textContent =
                datos.titulo || "Fin de la partida";
            document.getElementById("detalle-resultado").textContent =
                datos.detalle || "";
            musica.pause();
        });

        socket.on("errorSala", mensaje => {
            mensajeMenu.textContent = mensaje;
        });

        window.addEventListener("keydown", e => {
            const tecla = e.key.toLowerCase();

            if ([
                "arrowup", "arrowdown", "arrowleft", "arrowright", " "
            ].includes(tecla)) {
                e.preventDefault();
            }

            teclas[tecla] = true;
        });

        window.addEventListener("keyup", e => {
            teclas[e.key.toLowerCase()] = false;
        });

        window.addEventListener("blur", () => {
            teclas = {};
        });

        function actualizarMovimiento() {
            requestAnimationFrame(actualizarMovimiento);

            if (
                !miId ||
                finPartida ||
                !["contando", "buscando"].includes(fase)
            ) {
                return;
            }

            let dx = 0;
            let dy = 0;

            if (teclas["w"] || teclas["arrowup"]) dy -= 1;
            if (teclas["s"] || teclas["arrowdown"]) dy += 1;
            if (teclas["a"] || teclas["arrowleft"]) dx -= 1;
            if (teclas["d"] || teclas["arrowright"]) dx += 1;

            if (dx === 0 && dy === 0) return;

            const largo = Math.hypot(dx, dy);
            dx /= largo;
            dy /= largo;

            const velocidad = 3.2;
            const nuevoX = posicion.x + dx * velocidad;
            const nuevoY = posicion.y + dy * velocidad;

            // Comprobar X e Y por separado permite deslizarse junto a paredes.
            if (!colisiona(nuevoX, posicion.y)) {
                posicion.x = nuevoX;
            }

            if (!colisiona(posicion.x, nuevoY)) {
                posicion.y = nuevoY;
            }

            moverCamara();

            const ahora = performance.now();
            if (ahora - ultimoEnvio > 45) {
                ultimoEnvio = ahora;
                socket.emit("moverJugador", {
                    x: posicion.x,
                    y: posicion.y
                });
            }
        }

        crearMapa();
        actualizarMovimiento();

        window.addEventListener("resize", moverCamara);
    </script>
</body>
</html>
