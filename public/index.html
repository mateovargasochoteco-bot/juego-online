<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de escondite</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button, input {
    padding: 12px;
    font-size: 17px;
}

button {
    cursor: pointer;
    background: #ff4500;
    border: 0;
    color: white;
    font-weight: bold;
}

#informacion {
    position: fixed;
    z-index: 30;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
}

#codigoSala, #temporizadorPartida {
    background: #222;
    border: 2px solid orange;
    padding: 10px;
    font-weight: bold;
}

#estado {
    position: fixed;
    z-index: 30;
    top: 55px;
    left: 10px;
    background: #222;
    padding: 8px;
}

#camara {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #252525;
}

#mapa {
    position: absolute;
    width: 1450px;
    height: 1200px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #303030;
}

/* HABITACIONES */

.habitacion {
    position: absolute;
    width: 350px;
    height: 300px;
    background: #555;
    border: none;
    z-index: 2;
}

/* PAREDES: cada habitación tiene cuatro paredes separadas */

.pared {
    position: absolute;
    background: #171717;
    z-index: 4;
}

/* Habitaciones: x=50, 550, 1050; y=50, 450, 850 */

.habitacion {
    background:
        linear-gradient(#171717, #171717) top / 100% 13px no-repeat,
        linear-gradient(#171717, #171717) bottom / 100% 13px no-repeat,
        linear-gradient(#171717, #171717) left / 13px 100% no-repeat,
        linear-gradient(#171717, #171717) right / 13px 100% no-repeat,
        #555;
}

/* PASILLOS */

.pasillo-horizontal,
.pasillo-vertical {
    position: absolute;
    background: #777;
    z-index: 1;
}

.pasillo-horizontal {
    width: 150px;
    height: 90px;
}

.pasillo-vertical {
    width: 90px;
    height: 100px;
}

/* Puertas: aberturas de las paredes */

.hueco {
    position: absolute;
    z-index: 5;
    background: #777;
}

.hueco-h {
    width: 18px;
    height: 48px;
}

.hueco-v {
    width: 48px;
    height: 18px;
}

/* Marcos de las puertas */

.puerta {
    position: absolute;
    z-index: 7;
    pointer-events: none;
}

.puerta-h {
    width: 8px;
    height: 48px;
    border-top: 4px solid #8b4513;
    border-bottom: 4px solid #8b4513;
    background: #c18a45;
}

.puerta-v {
    width: 48px;
    height: 8px;
    border-left: 4px solid #8b4513;
    border-right: 4px solid #8b4513;
    background: #c18a45;
}

/* JUGADORES */

.jugador {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid white;
    z-index: 10;
    transform: translate(-50%, -50%);
}

.jugador.propio {
    border-color: yellow;
}

.jugador.buscador {
    background: red;
}

.jugador.escondido {
    background: #00aaff;
}

/* OBJETOS */

.objeto {
    position: absolute;
    width: 25px;
    height: 25px;
    color: yellow;
    font-size: 25px;
    z-index: 8;
    transform: translate(-50%, -50%);
}

/* VISIÓN */

#vision {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

#pantallaNegra {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 40;
    display: none;
}

#minimapa {
    position: fixed;
    z-index: 35;
    bottom: 10px;
    right: 10px;
    width: 190px;
    height: 160px;
    background: #111;
    border: 2px solid white;
}

#minimapa canvas {
    width: 100%;
    height: 100%;
}

#controles {
    position: fixed;
    z-index: 30;
    bottom: 10px;
    left: 10px;
    background: #222;
    padding: 10px;
}

#objetivo {
    position: fixed;
    z-index: 30;
    top: 100px;
    left: 10px;
    background: #222;
    padding: 10px;
}

#mensajePartida {
    position: fixed;
    z-index: 50;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 35px;
    font-weight: bold;
    text-align: center;
    text-shadow: 2px 2px black;
    pointer-events: none;
}

#resultado {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.9);
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 20px;
    font-size: 35px;
}

@media(max-width: 700px) {
    #minimapa {
        width: 120px;
        height: 100px;
    }

    #controles {
        font-size: 12px;
    }
}
</style>
</head>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const menu = document.getElementById("menu");
const mensaje = document.getElementById("mensaje");
const mapa = document.getElementById("mapa");
const camara = document.getElementById("camara");
const pantallaNegra = document.getElementById("pantallaNegra");

const elementosJugadores = document.getElementById("elementosJugadores");
const elementosObjetos = document.getElementById("elementosObjetos");

const canvas = document.getElementById("canvasMinimapa");
const ctx = canvas.getContext("2d");

let jugadores = {};
let objetos = [];
let miId = null;
let miRol = null;
let fase = "esperando";
let x = 150;
let y = 150;
let teclas = {};
let ultimoEnvio = 0;
let atrapado = false;

const anchoMapa = 1450;
const altoMapa = 1200;

document.getElementById("crearSala").onclick = () => {
    socket.emit("crearSala");
};

document.getElementById("unirseSala").onclick = () => {
    const codigo = document.getElementById("codigoInput").value.trim().toUpperCase();

    if (codigo) {
        socket.emit("unirseSala", codigo);
    }
};

socket.on("connect", () => {
    miId = socket.id;
});

socket.on("errorSala", texto => {
    mensaje.textContent = texto;
});

socket.on("salaCreada", codigo => {
    document.getElementById("codigoSala").textContent = "Sala: " + codigo;
});

socket.on("unidoSala", codigo => {
    document.getElementById("codigoSala").textContent = "Sala: " + codigo;
    menu.style.display = "none";
});

socket.on("estadoSala", datos => {
    jugadores = datos.jugadores;
    objetos = datos.objetos || [];
    fase = datos.fase;
    miRol = datos.miRol;

    if (jugadores[miId]) {
        x = jugadores[miId].x;
        y = jugadores[miId].y;
        atrapado = jugadores[miId].atrapado || false;
    }

    actualizarJugadores();
    actualizarObjetos();
    actualizarInterfaz();
});

socket.on("inicioCuenta", () => {
    fase = "cuenta";
    document.getElementById("mensajePartida").textContent = "¡A ESCONDERSE!";
});

socket.on("cuentaActualizada", tiempo => {
    document.getElementById("temporizadorPartida").textContent =
        "Cuenta: " + tiempo;
});

socket.on("finCuenta", () => {
    fase = "busqueda";
    document.getElementById("mensajePartida").textContent = "¡A BUSCAR!";
    setTimeout(() => {
        document.getElementById("mensajePartida").textContent = "";
    }, 2500);
});

socket.on("tiempoActualizado", tiempo => {
    document.getElementById("temporizadorPartida").textContent =
        "Tiempo: " + tiempo;
});

socket.on("objetoRecogido", datos => {
    objetos = datos.objetos;
    actualizarObjetos();
});

socket.on("jugadorAtrapado", datos => {
    jugadores = datos.jugadores;
    actualizarJugadores();
});

socket.on("finPartida", ganador => {
    document.getElementById("resultado").style.display = "flex";
    document.getElementById("textoResultado").textContent = ganador;
});

function actualizarInterfaz() {
    document.getElementById("estado").textContent =
        "Rol: " + (miRol || "Esperando");

    document.getElementById("objetivo").textContent =
        miRol === "buscador"
            ? "Objetivo: encontrar a todos"
            : "Objetivo: recoger las estrellas";

    pantallaNegra.style.display =
        fase === "cuenta" && miRol === "buscador" ? "block" : "none";

    // Durante la cuenta, el buscador no ve a los jugadores en su minimapa.
    dibujarMinimapa();
}

function actualizarJugadores() {
    elementosJugadores.innerHTML = "";

    for (const id in jugadores) {
        const jugador = jugadores[id];

        if (jugador.atrapado) continue;

        // El buscador no ve a los escondidos durante la cuenta.
        if (miRol === "buscador" && fase === "cuenta" && jugador.rol !== "buscador") {
            continue;
        }

        // Los escondidos no ven al buscador en el mapa.
        if (miRol === "escondido" && jugador.rol === "buscador") {
            continue;
        }

        const elemento = document.createElement("div");
        elemento.className = "jugador " +
            (jugador.rol === "buscador" ? "buscador" : "escondido");

        if (id === miId) elemento.classList.add("propio");

        elemento.style.left = jugador.x + "px";
        elemento.style.top = jugador.y + "px";

        elementosJugadores.appendChild(elemento);
    }
}

function actualizarObjetos() {
    elementosObjetos.innerHTML = "";

    objetos.forEach(objeto => {
        if (objeto.recogido) return;

        const elemento = document.createElement("div");
        elemento.className = "objeto";
        elemento.textContent = "★";
        elemento.style.left = objeto.x + "px";
        elemento.style.top = objeto.y + "px";

        elementosObjetos.appendChild(elemento);
    });
}

function dibujarMinimapa() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#303030";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#777";

    for (let fila = 0; fila < 3; fila++) {
        for (let columna = 0; columna < 3; columna++) {
            ctx.fillRect(
                50 + columna * 500,
                50 + fila * 400,
                350,
                300
            );
        }
    }

    ctx.fillStyle = "#999";

    for (let fila = 0; fila < 3; fila++) {
        for (let columna = 0; columna < 2; columna++) {
            ctx.fillRect(400 + columna * 500, 155 + fila * 400, 150, 90);
        }
    }

    for (let fila = 0; fila < 2; fila++) {
        for (let columna = 0; columna < 3; columna++) {
            ctx.fillRect(180 + columna * 500, 350 + fila * 400, 90, 100);
        }
    }

    for (const id in jugadores) {
        const jugador = jugadores[id];

        if (jugador.atrapado) continue;

        if (miRol === "buscador" && fase === "cuenta") continue;
        if (miRol === "escondido" && jugador.rol === "buscador") continue;

        ctx.fillStyle = jugador.rol === "buscador" ? "red" : "#00aaff";
        ctx.beginPath();
        ctx.arc(
            jugador.x / anchoMapa * canvas.width,
            jugador.y / altoMapa * canvas.height,
            5,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }
}

function dentroDeZona(px, py) {
    const habitaciones = [
        {x:50, y:50}, {x:550, y:50}, {x:1050, y:50},
        {x:50, y:450}, {x:550, y:450}, {x:1050, y:450},
        {x:50, y:850}, {x:550, y:850}, {x:1050, y:850}
    ];

    for (const h of habitaciones) {
        if (px >= h.x + 13 && px <= h.x + 337 &&
            py >= h.y + 13 && py <= h.y + 287) {
            return true;
        }
    }

    for (let fila = 0; fila < 3; fila++) {
        for (let col = 0; col < 2; col++) {
            const cx = 400 + col * 500;
            const cy = 155 + fila * 400;

            if (px >= cx && px <= cx + 150 &&
                py >= cy && py <= cy + 90) {
                return true;
            }
        }
    }

    for (let fila = 0; fila < 2; fila++) {
        for (let col = 0; col < 3; col++) {
            const cx = 180 + col * 500;
            const cy = 350 + fila * 400;

            if (px >= cx && px <= cx + 90 &&
                py >= cy && py <= cy + 100) {
                return true;
            }
        }
    }

    return false;
}

/*
 * Comprueba que el jugador cruce las paredes de las habitaciones
 * solamente por las aberturas de las puertas.
 */
function cruzaPared(ax, ay, bx, by) {
    const habitaciones = [
        {x:50,y:50}, {x:550,y:50}, {x:1050,y:50},
        {x:50,y:450}, {x:550,y:450}, {x:1050,y:450},
        {x:50,y:850}, {x:550,y:850}, {x:1050,y:850}
    ];

    for (const h of habitaciones) {
        const izquierda = h.x + 13;
        const derecha = h.x + 337;
        const arriba = h.y + 13;
        const abajo = h.y + 287;

        // Pared izquierda y derecha: puertas en el centro vertical.
        if ((ax < izquierda && bx >= izquierda) ||
            (ax > derecha && bx <= derecha)) {
            // La comprobación del borde exterior de la habitación
            // se realiza con el centro del jugador.
        }

        // Salida por la pared derecha.
        if (ax <= derecha && bx > derecha) {
            const puertaY = h.y + 150;
            if (Math.abs(by - puertaY) > 24) return true;
        }

        // Entrada por la pared derecha.
        if (ax > derecha && bx <= derecha) {
            const puertaY = h.y + 150;
            if (Math.abs(by - puertaY) > 24) return true;
        }

        // Salida por la pared izquierda.
        if (ax >= izquierda && bx < izquierda) {
            const puertaY = h.y + 150;
            if (Math.abs(by - puertaY) > 24) return true;
        }

        // Entrada por la pared izquierda.
        if (ax < izquierda && bx >= izquierda) {
            const puertaY = h.y + 150;
            if (Math.abs(by - puertaY) > 24) return true;
        }

        // Salida por arriba y abajo.
        if (ay >= arriba && by < arriba) {
            const puertaX = h.x + 175;
            if (Math.abs(bx - puertaX) > 24) return true;
        }

        if (ay <= abajo && by > abajo) {
            const puertaX = h.x + 175;
            if (Math.abs(bx - puertaX) > 24) return true;
        }

        if (ay < arriba && by >= arriba) {
            const puertaX = h.x + 175;
            if (Math.abs(bx - puertaX) > 24) return true;
        }

        if (ay > abajo && by <= abajo) {
            const puertaX = h.x + 175;
            if (Math.abs(bx - puertaX) > 24) return true;
        }
    }

    return false;
}

function mover() {
    if (!miId || !jugadores[miId] || atrapado) return;
    if (fase === "esperando" || fase === "cuenta" && miRol === "buscador") return;

    let dx = 0;
    let dy = 0;

    if (teclas["w"] || teclas["ArrowUp"]) dy -= 3.5;
    if (teclas["s"] || teclas["ArrowDown"]) dy += 3.5;
    if (teclas["a"] || teclas["ArrowLeft"]) dx -= 3.5;
    if (teclas["d"] || teclas["ArrowRight"]) dx += 3.5;

    if (dx !== 0 && dy !== 0) {
        dx *= 0.707;
        dy *= 0.707;
    }

    const nuevoX = x + dx;
    const nuevoY = y + dy;

    if (dentroDeZona(nuevoX, nuevoY) &&
        !cruzaPared(x, y, nuevoX, nuevoY)) {
        x = nuevoX;
        y = nuevoY;
    } else {
        // Permite deslizarse por una pared sin atravesarla.
        if (dentroDeZona(x + dx, y) &&
            !cruzaPared(x, y, x + dx, y)) {
            x += dx;
        }

        if (dentroDeZona(x, y + dy) &&
            !cruzaPared(x, y, x, y + dy)) {
            y += dy;
        }
    }

    const ahora = Date.now();

    if (ahora - ultimoEnvio > 45) {
        socket.emit("moverJugador", {x, y});
        ultimoEnvio = ahora;
    }

    actualizarCamara();
}

function actualizarCamara() {
    const ancho = window.innerWidth;
    const alto = window.innerHeight;

    const camX = ancho / 2 - x;
    const camY = alto / 2 - y;

    mapa.style.transform =
        `translate(${camX}px, ${camY}px)`;

    if (miRol === "buscador" && fase === "busqueda") {
        const radio = 180;

        const gradiente = `radial-gradient(circle ${radio}px at ${ancho/2}px ${alto/2}px,
            transparent 0%,
            rgba(0,0,0,0.25) 65%,
            black 100%)`;

        camara.style.background = "black";
        document.getElementById("vision").style.background = gradiente;
    } else {
        camara.style.background = "#252525";
    }
}

function intentarAtrapar() {
    if (miRol === "buscador" && fase === "busqueda") {
        socket.emit("atrapar");
    }
}

window.addEventListener("keydown", e => {
    teclas[e.key] = true;

    if (e.key === " " || e.key.toLowerCase() === "e") {
        intentarAtrapar();
    }
});

window.addEventListener("keyup", e => {
    teclas[e.key] = false;
});

setInterval(mover, 16);

setInterval(() => {
    actualizarCamara();
    dibujarMinimapa();
}, 50);

socket.on("estadoSala", () => {
    actualizarCamara();
});
</script>
