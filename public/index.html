<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escondite Online</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
#menu {
    width: 380px;
    max-width: 90%;
    margin: 70px auto;
    padding: 25px;
    background: #292d35;
    border-radius: 14px;
    text-align: center;
}
input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: 0;
    border-radius: 7px;
    font-size: 16px;
}
button {
    background: #35a853;
    color: white;
    cursor: pointer;
}
button:hover { background: #27833f; }
#mensaje { color: #ffd166; min-height: 20px; }

#juego { display: none; width: 100vw; height: 100vh; }
#informacion {
    position: fixed;
    z-index: 100;
    top: 0;
    left: 0;
    width: 100%;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #080808;
    border-bottom: 2px solid white;
}
#codigoSala { color: #ffd166; letter-spacing: 3px; }
#temporizadorPartida { font-size: 25px; color: #ffcc00; }

#camara {
    position: fixed;
    top: 65px;
    left: 0;
    width: 100vw;
    height: calc(100vh - 65px);
    overflow: hidden;
    background: #222;
}
#mapa {
    position: absolute;
    width: 1450px;
    height: 1200px;
    left: 0;
    top: 0;
    transform-origin: top left;
    background: #454545;
}

/* Habitaciones */
.habitacion {
    position: absolute;
    width: 350px;
    height: 300px;
    background: #777;
    border: 13px solid #171717;
    z-index: 2;
}
.habitacion::after {
    content: "";
    position: absolute;
    inset: 12px;
    border: 2px dashed rgba(255,255,255,.12);
    pointer-events: none;
}
#habitacion1 { left:50px; top:50px; }
#habitacion2 { left:550px; top:50px; }
#habitacion3 { left:1050px; top:50px; }
#habitacion4 { left:50px; top:450px; }
#habitacion5 { left:550px; top:450px; }
#habitacion6 { left:1050px; top:450px; }
#habitacion7 { left:50px; top:850px; }
#habitacion8 { left:550px; top:850px; }
#habitacion9 { left:1050px; top:850px; }

/* Pasillos */
.pasillo {
    position: absolute;
    background: #666;
    z-index: 1;
}
.pasillo-horizontal {
    width: 150px;
    height: 90px;
}
.pasillo-vertical {
    width: 90px;
    height: 100px;
}
.h1 { left:400px; top:155px; }
.h2 { left:900px; top:155px; }
.h3 { left:400px; top:555px; }
.h4 { left:900px; top:555px; }
.h5 { left:400px; top:955px; }
.h6 { left:900px; top:955px; }
.v1 { left:180px; top:350px; }
.v2 { left:680px; top:350px; }
.v3 { left:1180px; top:350px; }
.v4 { left:180px; top:750px; }
.v5 { left:680px; top:750px; }
.v6 { left:1180px; top:750px; }

/* Puertas visibles */
.puerta {
    position: absolute;
    z-index: 3;
    background: #b58b50;
    border: 3px solid #4b3218;
}
.puerta-h {
    width: 55px;
    height: 12px;
}
.puerta-v {
    width: 12px;
    height: 55px;
}
.ph1 { left:445px; top:194px; }
.ph2 { left:945px; top:194px; }
.ph3 { left:445px; top:594px; }
.ph4 { left:945px; top:594px; }
.ph5 { left:445px; top:994px; }
.ph6 { left:945px; top:994px; }
.pv1 { left:219px; top:372px; }
.pv2 { left:719px; top:372px; }
.pv3 { left:1219px; top:372px; }
.pv4 { left:219px; top:772px; }
.pv5 { left:719px; top:772px; }
.pv6 { left:1219px; top:772px; }

.jugador {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid white;
    z-index: 10;
    transform: translate(-50%, -50%);
}
.jugador.propio { border: 3px solid #ffe600; }
.jugador.buscador { background: #e53935; }
.jugador.escondido { background: #2196f3; }
.jugador.atrapado { background: #777; opacity: .5; }

#minimapa {
    position: fixed;
    z-index: 110;
    right: 15px;
    bottom: 15px;
    width: 190px;
    height: 155px;
    background: rgba(0,0,0,.85);
    border: 2px solid white;
    border-radius: 8px;
}
#minimapa canvas { width: 100%; height: 100%; }

#estado {
    position: fixed;
    z-index: 110;
    left: 15px;
    bottom: 15px;
    background: rgba(0,0,0,.8);
    padding: 10px 14px;
    border-radius: 7px;
}
#controles {
    position: fixed;
    z-index: 110;
    left: 15px;
    top: 80px;
    background: rgba(0,0,0,.7);
    padding: 9px;
    border-radius: 7px;
    font-size: 13px;
}
#mensajePartida {
    position: fixed;
    z-index: 120;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    padding: 10px 18px;
    border-radius: 8px;
    text-align: center;
}
#camara.vision-limitada::after {
    content: "";
    position: absolute;
    z-index: 50;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        circle 210px at 50% 50%,
        transparent 0,
        transparent 115px,
        rgba(0,0,0,.88) 190px,
        #000 240px
    );
}
#pantallaNegra {
    display: none;
    position: fixed;
    z-index: 80;
    inset: 65px 0 0;
    background: #000;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 28px;
}
#pantallaNegra.activa { display: flex; }

#resultado {
    display: none;
    position: fixed;
    z-index: 200;
    inset: 0;
    background: rgba(0,0,0,.9);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}
#resultado.activo { display: flex; }
#resultado h1 { font-size: 42px; color: #ffcc00; }
#resultado button { width: 220px; }

@media(max-width:650px) {
    #minimapa { width: 140px; height: 115px; }
    #controles { font-size: 11px; }
}
</style>
</head>

<body>
<div id="menu">
    <h1>ESCONDITE ONLINE</h1>
    <p>Se necesitan 4 jugadores para comenzar.</p>
    <button id="crearSala">CREAR SALA</button>
    <input id="codigoInput" maxlength="5" placeholder="Código de sala">
    <button id="unirseSala">UNIRSE A UNA SALA</button>
    <p id="mensaje"></p>
</div>

<div id="juego">
    <div id="informacion">
        <div>CÓDIGO: <strong id="codigoSala">-----</strong></div>
        <div id="temporizadorPartida">Esperando...</div>
    </div>

    <div id="camara">
        <div id="mapa">
            <div class="pasillo pasillo-horizontal h1"></div>
            <div class="pasillo pasillo-horizontal h2"></div>
            <div class="pasillo pasillo-horizontal h3"></div>
            <div class="pasillo pasillo-horizontal h4"></div>
            <div class="pasillo pasillo-horizontal h5"></div>
            <div class="pasillo pasillo-horizontal h6"></div>

            <div class="pasillo pasillo-vertical v1"></div>
            <div class="pasillo pasillo-vertical v2"></div>
            <div class="pasillo pasillo-vertical v3"></div>
            <div class="pasillo pasillo-vertical v4"></div>
            <div class="pasillo pasillo-vertical v5"></div>
            <div class="pasillo pasillo-vertical v6"></div>

            <div id="habitacion1" class="habitacion"></div>
            <div id="habitacion2" class="habitacion"></div>
            <div id="habitacion3" class="habitacion"></div>
            <div id="habitacion4" class="habitacion"></div>
            <div id="habitacion5" class="habitacion"></div>
            <div id="habitacion6" class="habitacion"></div>
            <div id="habitacion7" class="habitacion"></div>
            <div id="habitacion8" class="habitacion"></div>
            <div id="habitacion9" class="habitacion"></div>

            <div class="puerta puerta-h ph1"></div>
            <div class="puerta puerta-h ph2"></div>
            <div class="puerta puerta-h ph3"></div>
            <div class="puerta puerta-h ph4"></div>
            <div class="puerta puerta-h ph5"></div>
            <div class="puerta puerta-h ph6"></div>
            <div class="puerta puerta-v pv1"></div>
            <div class="puerta puerta-v pv2"></div>
            <div class="puerta puerta-v pv3"></div>
            <div class="puerta puerta-v pv4"></div>
            <div class="puerta puerta-v pv5"></div>
            <div class="puerta puerta-v pv6"></div>
        </div>
    </div>

    <div id="controles">
        <b>CONTROLES</b><br>
        WASD o flechas: moverse<br>
        Acercate al buscador para que te encuentre
    </div>

    <div id="mensajePartida">Esperando jugadores...</div>
    <div id="estado">Rol: esperando</div>
    <div id="minimapa"><canvas id="canvasMini" width="380" height="310"></canvas></div>
    <div id="pantallaNegra"><div>ESTÁS CONTANDO<br><span id="cuentaTexto">15</span></div></div>

    <div id="resultado">
        <h1 id="tituloResultado">FIN DE LA PARTIDA</h1>
        <p id="textoResultado"></p>
        <button id="volverMenu">VOLVER AL MENÚ</button>
    </div>
</div>

<audio id="musicaPartida" loop></audio>

<script>
const socket = io();

const menu = document.getElementById("menu");
const juego = document.getElementById("juego");
const mensaje = document.getElementById("mensaje");
const mapa = document.getElementById("mapa");
const camara = document.getElementById("camara");
const temporizador = document.getElementById("temporizadorPartida");
const mensajePartida = document.getElementById("mensajePartida");
const estado = document.getElementById("estado");
const pantallaNegra = document.getElementById("pantallaNegra");
const cuentaTexto = document.getElementById("cuentaTexto");
const resultado = document.getElementById("resultado");
const canvas = document.getElementById("canvasMini");
const ctx = canvas.getContext("2d");
const musica = document.getElementById("musicaPartida");

const canciones = [
    "/img/gd1.mp3",
    "/img/gd2.mp3",
    "/img/gd3.mp3",
    "/img/gd4.mp3"
];

let miId = null;
let codigoSala = null;
let jugadores = [];
let miRol = "";
let fase = "esperando";
let miX = 0;
let miY = 0;
let teclas = {};
let ultimoEnvio = 0;
let resultadoMostrado = false;

const MAPA = { ancho: 1450, alto: 1200 };

document.getElementById("crearSala").onclick = () => {
    socket.emit("crearSala");
};
document.getElementById("unirseSala").onclick = () => {
    const codigo = document.getElementById("codigoInput").value.trim().toUpperCase();
    if (!codigo) {
        mensaje.textContent = "Ingresá un código.";
        return;
    }
    socket.emit("unirseSala", codigo);
};

socket.on("connect", () => { miId = socket.id; });

socket.on("errorSala", texto => {
    mensaje.textContent = texto;
});

socket.on("salaCreada", codigo => entrarAlJuego(codigo));
socket.on("unidoSala", codigo => entrarAlJuego(codigo));

function entrarAlJuego(codigo) {
    codigoSala = codigo;
    document.getElementById("codigoSala").textContent = codigo;
    menu.style.display = "none";
    juego.style.display = "block";
    mensajePartida.textContent = "Esperando a los otros jugadores...";
}

socket.on("estadoSala", datos => {
    jugadores = datos.jugadores || [];
    fase = datos.fase;
    miRol = datos.roles?.[miId] || miRol;

    const yo = jugadores.find(j => j.id === miId);
    if (yo) {
        miX = yo.x;
        miY = yo.y;
    }

    actualizarInterfaz(datos);
    dibujarJugadores();
    dibujarMinimapa();
});

socket.on("inicioCuenta", datos => {
    fase = "contando";
    miRol = datos.roles?.[miId] || miRol;
    mensajePartida.textContent = miRol === "buscador"
        ? "¡Contá! Los demás se están escondiendo."
        : "¡Escondete! El buscador está contando.";
    actualizarPantallaCuenta(datos.segundos);
});

socket.on("cuentaActualizada", datos => {
    if (miRol === "buscador") cuentaTexto.textContent = datos.segundos;
    temporizador.textContent = "Cuenta: " + datos.segundos;
});

socket.on("finCuenta", () => {
    fase = "buscando";
    pantallaNegra.classList.remove("activa");
    camara.classList.toggle("vision-limitada", miRol === "buscador");
    mensajePartida.textContent = miRol === "buscador"
        ? "¡Buscá a los jugadores escondidos!"
        : "¡No dejes que te encuentren!";
});

socket.on("tiempoActualizado", datos => {
    temporizador.textContent = "Tiempo: " + datos.segundos + "s";
});

socket.on("jugadorAtrapado", datos => {
    mensajePartida.textContent = datos.nombre + " fue encontrado.";
});

socket.on("finPartida", datos => {
    fase = "terminada";
    pantallaNegra.classList.remove("activa");
    musica.pause();
    document.getElementById("tituloResultado").textContent = datos.titulo;
    document.getElementById("textoResultado").textContent = datos.mensaje;
    resultado.classList.add("activo");
});

function actualizarInterfaz(datos) {
    if (fase === "esperando") {
        temporizador.textContent = jugadores.length + "/4 jugadores";
        mensajePartida.textContent = jugadores.length < 4
            ? "Esperando jugadores (" + jugadores.length + "/4)"
            : "Preparando partida...";
    }

    if (fase === "contando" && miRol === "buscador") {
        pantallaNegra.classList.add("activa");
        camara.classList.remove("vision-limitada");
    } else if (fase !== "contando") {
        pantallaNegra.classList.remove("activa");
    }

    if (fase === "buscando") {
        camara.classList.toggle("vision-limitada", miRol === "buscador");
    }

    const roles = {
        buscador: "BUSCADOR",
        escondido: "ESCONDIDO"
    };
    estado.textContent = "Rol: " + (roles[miRol] || "esperando");
}

function actualizarPantallaCuenta(segundos) {
    if (miRol === "buscador") {
        pantallaNegra.classList.add("activa");
        cuentaTexto.textContent = segundos;
        camara.classList.remove("vision-limitada");
    } else {
        pantallaNegra.classList.remove("activa");
    }
}

function dibujarJugadores() {
    document.querySelectorAll(".jugador").forEach(e => e.remove());

    jugadores.forEach(j => {
        if (j.atrapado) return;
        const el = document.createElement("div");
        el.className = "jugador " +
            (j.rol === "buscador" ? "buscador" : "escondido") +
            (j.id === miId ? " propio" : "");
        el.style.left = j.x + "px";
        el.style.top = j.y + "px";
        el.title = j.nombre || (j.rol === "buscador" ? "Buscador" : "Jugador");
        mapa.appendChild(el);
    });
}

function dibujarMinimapa() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const sx = canvas.width / MAPA.ancho;
    const sy = canvas.height / MAPA.alto;

    ctx.fillStyle = "#888";
    for (let fila = 0; fila < 3; fila++) {
        for (let col = 0; col < 3; col++) {
            ctx.fillRect((50 + col * 500) * sx, (50 + fila * 400) * sy,
                350 * sx, 300 * sy);
        }
    }

    ctx.fillStyle = "#666";
    for (let fila = 0; fila < 3; fila++) {
        ctx.fillRect(400*sx, (155+fila*400)*sy, 150*sx, 90*sy);
        ctx.fillRect(900*sx, (155+fila*400)*sy, 150*sx, 90*sy);
    }
    for (let col = 0; col < 3; col++) {
        ctx.fillRect((180+col*500)*sx, 350*sy, 90*sx, 100*sy);
        ctx.fillRect((180+col*500)*sx, 750*sy, 90*sx, 100*sy);
    }

    jugadores.forEach(j => {
        if (j.atrapado) return;

        // El buscador no aparece en el minimapa de los escondidos.
        if (miRol === "escondido" && j.rol === "buscador") return;

        ctx.fillStyle = j.rol === "buscador" ? "#f33" : "#28a9ff";
        ctx.beginPath();
        ctx.arc(j.x*sx, j.y*sy, 7, 0, Math.PI*2);
        ctx.fill();
    });
}

function moverCamara() {
    const ancho = camara.clientWidth;
    const alto = camara.clientHeight;
    const x = ancho / 2 - miX;
    const y = alto / 2 - miY;
    mapa.style.transform = `translate(${x}px, ${y}px)`;
}

function dentroDeZona(x, y) {
    const habitaciones = [
        [50,50,350,300], [550,50,350,300], [1050,50,350,300],
        [50,450,350,300], [550,450,350,300], [1050,450,350,300],
        [50,850,350,300], [550,850,350,300], [1050,850,350,300]
    ];
    const pasillosH = [
        [400,155,150,90], [900,155,150,90],
        [400,555,150,90], [900,555,150,90],
        [400,955,150,90], [900,955,150,90]
    ];
    const pasillosV = [
        [180,350,90,100], [680,350,90,100], [1180,350,90,100],
        [180,750,90,100], [680,750,90,100], [1180,750,90,100]
    ];
    return [...habitaciones, ...pasillosH, ...pasillosV].some(z =>
        x >= z[0]+12 && x <= z[0]+z[2]-12 &&
        y >= z[1]+12 && y <= z[1]+z[3]-12
    );
}

document.addEventListener("keydown", e => {
    const tecla = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(tecla)) e.preventDefault();
    teclas[tecla] = true;

    if (tecla === " " || tecla === "e") {
        if (fase === "buscando" && miRol === "buscador") {
            socket.emit("intentarAtrapar");
        }
    }
});
document.addEventListener("keyup", e => {
    teclas[e.key.toLowerCase()] = false;
});
window.addEventListener("blur", () => { teclas = {}; });

function bucleMovimiento() {
    requestAnimationFrame(bucleMovimiento);

    if (fase === "esperando" || fase === "terminada") return;
    if (miRol === "buscador" && fase === "contando") return;

    let dx = 0, dy = 0;
    if (teclas["a"] || teclas["arrowleft"]) dx--;
    if (teclas["d"] || teclas["arrowright"]) dx++;
    if (teclas["w"] || teclas["arrowup"]) dy--;
    if (teclas["s"] || teclas["arrowdown"]) dy++;

    if (dx === 0 && dy === 0) {
        moverCamara();
        return;
    }

    const largo = Math.hypot(dx, dy);
    dx = dx / largo * 3.5;
    dy = dy / largo * 3.5;

    const nuevoX = miX + dx;
    const nuevoY = miY + dy;

    if (dentroDeZona(nuevoX, miY)) miX = nuevoX;
    if (dentroDeZona(miX, nuevoY)) miY = nuevoY;

    moverCamara();

    const ahora = Date.now();
    if (ahora - ultimoEnvio > 45) {
        socket.emit("moverJugador", { x: miX, y: miY });
        ultimoEnvio = ahora;
    }
}

bucleMovimiento();

document.getElementById("volverMenu").onclick = () => {
    location.reload();
};

socket.on("musicaPartida", () => {
    const cancion = canciones[Math.floor(Math.random() * canciones.length)];
    musica.src = cancion;
    musica.currentTime = 0;
    musica.play().catch(() => {
        mensajePartida.textContent = "Hacé clic en la pantalla para activar la música.";
    });
});
document.addEventListener("click", () => {
    if (musica.src && musica.paused && fase !== "terminada") {
        musica.play().catch(() => {});
    }
});
</script>
</body>
</html>
