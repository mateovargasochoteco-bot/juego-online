let miId = null;
let posicionInicialRecibida = false;

let miJugador = {
    x: 700,
    y: 450
};

let jugadoresActuales = [];
let miRol = "esperando";
let faseActual = "esperando";
let partidaTerminada = false;

const RADIO_JUGADOR = 18;
const teclas = Object.create(null);
const teclasMovimiento = new Set(["w", "a", "s", "d"]);

const elementosJugadores = new Map();

/* Música: nombres de archivos que vos colocás en public/img/ */
const canciones = [
    "/img/gd1.mp3",
    "/img/gd2.mp3",
    "/img/gd3.mp3",
    "/img/gd4.mp3"
];

let indiceCancionActual = -1;

/* =========================
   CONEXIÓN
========================= */

socket.on("connect", () => {
    miId = socket.id;
});

/* =========================
   CREAR / UNIRSE
========================= */

crearSala.addEventListener("click", () => {
    socket.emit("crearSala");
});

unirseSala.addEventListener("click", () => {
    const codigo = codigoInput.value.trim().toUpperCase();

    if (codigo === "") {
        mensaje.textContent = "Escribí un código.";
        return;
    }

    socket.emit("unirseSala", codigo);
});

codigoInput.addEventListener("keydown", evento => {
    if (evento.key === "Enter") {
        unirseSala.click();
    }
});

/* =========================
   ENTRAR
========================= */

socket.on("salaCreada", datos => {
    entrarAlJuego(datos);
});

socket.on("salaUnida", datos => {
    entrarAlJuego(datos);
});

function entrarAlJuego(datos) {
    menu.style.display = "none";
    juego.style.display = "block";

    posicionInicialRecibida = false;
    partidaTerminada = false;

    overlayPartida.style.display = "none";

    if (datos && datos.codigo) {
        codigoSala.textContent = datos.codigo;
    }

    if (datos && datos.jugadores !== undefined) {
        cantidadJugadores.textContent = datos.jugadores;
    }

    actualizarCamara();
}

/* =========================
   ESTADO DE PARTIDA
========================= */

   
socket.on("estadoSala", (estado) => {
    if (!estado) return;

    const hudEscondite = document.getElementById("hudEscondite");

    if (estado.cantidad !== undefined) {
        cantidadJugadores.textContent = estado.cantidad;
    }

    // Ocultar el panel negro mientras se espera si ya están los 4.
    // Si alguien se desconecta, vuelve a aparecer.
    if (hudEscondite) {
        const salaCompleta = estado.completa === true ||
            Number(estado.cantidad) >= 4;

        hudEscondite.style.display =
            salaCompleta && faseActual === "esperando" ? "none" : "";
    }
});

socket.on("estadoPartida", estado => {
    if (!estado) return;

    faseActual = estado.fase || "esperando";
    miRol = estado.miRol || "esperando";

    if (estado.jugadores !== undefined) {
        cantidadJugadores.textContent = estado.jugadores;
    }

    // Volver a mostrar el HUD cuando comience la cuenta o la búsqueda.
    // Durante la espera, ocultarlo solamente si hay 4 jugadores.
    const hudEscondite = document.getElementById("hudEscondite");
    if (hudEscondite) {
        const hayCuatroJugadores = jugadoresActuales.length >= 4 ||
            Number(estado.jugadores) >= 4;

        hudEscondite.style.display =
            faseActual === "esperando" && hayCuatroJugadores ? "none" : "";
    }

    actualizarHUD(estado);

    if (estado.fase === "fin") {
        mostrarResultado(estado);
    }
});

function actualizarHUD(estado) {
    const tiempo = Number.isFinite(estado.tiempo)
        ? Math.max(0, Math.ceil(estado.tiempo))
        : 0;

    temporizadorPartida.textContent =
        estado.fase === "esperando" ? "--" : tiempo;

    if (estado.fase === "cuenta") {
        fasePartida.textContent = "EL BUSCADOR CUENTA";

        rolPartida.textContent =
            miRol === "buscador"
                ? "Sos el BUSCADOR. No podés moverte todavía."
                : "Sos ESCONDIDO. ¡Buscá un lugar para esconderte!";

        mensajePartida.textContent =
            "El buscador está contando...";
    }
    else if (estado.fase === "busqueda") {
        fasePartida.textContent = "¡A BUSCAR!";

        rolPartida.textContent =
            miRol === "buscador"
                ? "Sos el BUSCADOR. Encontrá a los demás."
                : "Sos ESCONDIDO. ¡No dejes que te encuentren!";

        mensajePartida.textContent =
            "El buscador tiene una vista más reducida.";
    }
    else if (estado.fase === "fin") {
        fasePartida.textContent = "PARTIDA TERMINADA";
    }
    else {
        fasePartida.textContent = "ESPERANDO JUGADORES";
        rolPartida.textContent = "Se necesitan al menos 2 jugadores.";
        mensajePartida.textContent = "";
    }

    actualizarCamara();
}

/* =========================
   MÚSICA
========================= */

socket.on("musicaPartida", datos => {
    if (!datos || !Number.isInteger(datos.indice)) return;

    const indice = datos.indice % canciones.length;

    if (indice === indiceCancionActual) return;

    indiceCancionActual = indice;
    musicaPartida.src = canciones[indice];

    musicaPartida.currentTime = 0;

    const promesa = musicaPartida.play();

    if (promesa && typeof promesa.catch === "function") {
        promesa.catch(() => {
            // Algunos navegadores bloquean el audio si no hubo interacción.
        });
    }
});

function detenerMusica() {
    musicaPartida.pause();
    musicaPartida.currentTime = 0;
}

/* =========================
   JUGADORES
========================= */

socket.on("actualizarJugadores", jugadores => {
    jugadoresActuales = Array.isArray(jugadores) ? jugadores : [];

    cantidadJugadores.textContent = jugadoresActuales.length;

    actualizarJugadoresDOM();
});

function actualizarJugadoresDOM() {
    const idsVisibles = new Set();

    jugadoresActuales.forEach((jugador, indice) => {
        idsVisibles.add(jugador.id);

        let elemento = elementosJugadores.get(jugador.id);

        if (!elemento) {
            elemento = crearElementoJugador(jugador, indice);
            elementosJugadores.set(jugador.id, elemento);
            mapa.appendChild(elemento);
        }

        const esYo = jugador.id === miId;

        if (esYo && !posicionInicialRecibida) {
            miJugador.x = jugador.x;
            miJugador.y = jugador.y;
            posicionInicialRecibida = true;
        }

        elemento.classList.toggle("jugador1", esYo);
        elemento.classList.toggle("otroJugador", !esYo);
        elemento.classList.toggle("escondido", jugador.visible === false);
        elemento.classList.toggle("atrapado", jugador.atrapado === true);

        const nombre = elemento.querySelector(".nombreJugador");

        if (nombre) {
            nombre.textContent = esYo
                ? "YO"
                : (jugador.rol === "buscador"
                    ? "BUSCADOR"
                    : "Jugador " + (indice + 1));
        }

        if (!esYo) {
            elemento.style.left = jugador.x + "px";
            elemento.style.top = jugador.y + "px";
        }
    });

    for (const [id, elemento] of elementosJugadores.entries()) {
        if (!idsVisibles.has(id)) {
            elemento.remove();
            elementosJugadores.delete(id);
        }
    }

    renderizarJugadorLocal();
}

function crearElementoJugador(jugador, indice) {
    const elemento = document.createElement("div");
    elemento.className = "jugador";

    const cabeza = document.createElement("div");
    cabeza.className = "cabeza";

    const pelo = document.createElement("div");
    pelo.className = "pelo";

    const cuerpo = document.createElement("div");
    cuerpo.className = "cuerpo";

    const brazo1 = document.createElement("div");
    brazo1.className = "brazo brazo-izquierdo";

    const brazo2 = document.createElement("div");
    brazo2.className = "brazo brazo-derecho";

    const pierna1 = document.createElement("div");
    pierna1.className = "pierna pierna-izquierda";

    const pierna2 = document.createElement("div");
    pierna2.className = "pierna pierna-derecha";

    const nombre = document.createElement("div");
    nombre.className = "nombreJugador";

    nombre.textContent =
        jugador.id === miId
            ? "YO"
            : "Jugador " + (indice + 1);

    elemento.append(
        cabeza,
        pelo,
        cuerpo,
        brazo1,
        brazo2,
        pierna1,
        pierna2,
        nombre
    );

    elemento.style.left = jugador.x + "px";
    elemento.style.top = jugador.y + "px";

    return elemento;
}

function renderizarJugadorLocal() {
    const elemento = elementosJugadores.get(miId);

    if (!elemento) return;

    elemento.style.left = miJugador.x + "px";
    elemento.style.top = miJugador.y + "px";
}

/* =========================
   ERROR
========================= */

socket.on("errorSala", texto => {
    mensaje.textContent = texto;
});

/* =========================
   TECLADO
========================= */

document.addEventListener("keydown", evento => {
    const tecla = evento.key.toLowerCase();

    if (teclasMovimiento.has(tecla)) {
        evento.preventDefault();
        teclas[tecla] = true;
    }
});

document.addEventListener("keyup", evento => {
    const tecla = evento.key.toLowerCase();

    if (teclasMovimiento.has(tecla)) {
        evento.preventDefault();
        teclas[tecla] = false;
    }
});

window.addEventListener("blur", () => {
    for (const tecla of teclasMovimiento) {
        teclas[tecla] = false;
    }
});

/* =========================
   RECTÁNGULOS
========================= */

function rect(x, y, ancho, alto) {
    return { x, y, ancho, alto };
}

/* =========================
   PAREDES
   Solamente las paredes bloquean.
   Los pasillos y las puertas siguen
   siendo transitables.
========================= */

const paredes = [
    rect(50, 50, 350, 14),
    rect(50, 336, 350, 14),
    rect(50, 50, 14, 300),
    rect(386, 50, 14, 110),
    rect(386, 240, 14, 110),

    rect(525, 50, 350, 14),
    rect(525, 336, 350, 14),
    rect(525, 50, 14, 110),
    rect(525, 240, 14, 110),
    rect(861, 50, 14, 110),
    rect(861, 240, 14, 110),

    rect(1050, 50, 300, 14),
    rect(1050, 336, 300, 14),
    rect(1050, 50, 14, 110),
    rect(1050, 240, 14, 110),
    rect(1336, 50, 14, 300),

    rect(50, 500, 350, 14),
    rect(50, 836, 350, 14),
    rect(50, 500, 14, 350),
    rect(386, 500, 14, 110),
    rect(386, 690, 14, 160),

    rect(525, 500, 350, 14),
    rect(525, 836, 350, 14),
    rect(525, 500, 14, 110),
    rect(525, 690, 14, 160),
    rect(861, 500, 14, 110),
    rect(861, 690, 14, 160),

    rect(1050, 500, 300, 14),
    rect(1050, 836, 300, 14),
    rect(1050, 500, 14, 110),
    rect(1050, 690, 14, 160),
    rect(1336, 500, 14, 350)
];

function colisionaConPared(x, y, pared) {
    const puntoX = Math.max(
        pared.x,
        Math.min(x, pared.x + pared.ancho)
    );

    const puntoY = Math.max(
        pared.y,
        Math.min(y, pared.y + pared.alto)
    );

    const distanciaX = x - puntoX;
    const distanciaY = y - puntoY;

    return Math.sqrt(
        distanciaX * distanciaX +
        distanciaY * distanciaY
    ) < RADIO_JUGADOR;
}

function tocaPared(x, y) {
    return paredes.some(pared =>
        colisionaConPared(x, y, pared)
    );
}

/* =========================
   MOVIMIENTO
========================= */

function moverJugador(nuevoX, nuevoY) {
    if (!tocaPared(nuevoX, nuevoY)) {
        miJugador.x = nuevoX;
        miJugador.y = nuevoY;
        return;
    }

    if (!tocaPared(nuevoX, miJugador.y)) {
        miJugador.x = nuevoX;
    }

    if (!tocaPared(miJugador.x, nuevoY)) {
        miJugador.y = nuevoY;
    }
}

function actualizarMovimiento() {
    if (juego.style.display === "none") {
        requestAnimationFrame(actualizarMovimiento);
        return;
    }

    const velocidad = 5;

    /*
       Con 4 jugadores conectados, todos pueden moverse.
       Esto funciona incluso mientras la sala está esperando
       el inicio de la partida.
    */
    const hayCuatroJugadores =
        Array.isArray(jugadoresActuales) &&
        jugadoresActuales.length >= 4;

    const puedeMoverse =
        hayCuatroJugadores &&
        faseActual !== "fin";

    if (puedeMoverse && !partidaTerminada) {
        let nuevoX = miJugador.x;
        let nuevoY = miJugador.y;

        const arriba = teclas["w"] === true;
        const abajo = teclas["s"] === true;
        const izquierda = teclas["a"] === true;
        const derecha = teclas["d"] === true;

        if (arriba && !abajo) nuevoY -= velocidad;
        if (abajo && !arriba) nuevoY += velocidad;
        if (izquierda && !derecha) nuevoX -= velocidad;
        if (derecha && !izquierda) nuevoX += velocidad;

        nuevoX = Math.max(
            RADIO_JUGADOR,
            Math.min(1400 - RADIO_JUGADOR, nuevoX)
        );

        nuevoY = Math.max(
            RADIO_JUGADOR,
            Math.min(900 - RADIO_JUGADOR, nuevoY)
        );

        if (
            nuevoX !== miJugador.x ||
            nuevoY !== miJugador.y
        ) {
            moverJugador(nuevoX, nuevoY);

            socket.emit("moverJugador", {
                x: miJugador.x,
                y: miJugador.y
            });
        }
    }

    renderizarJugadorLocal();
    actualizarCamara();
    actualizarHabitacion();

    requestAnimationFrame(actualizarMovimiento);
}

/* =========================
   CÁMARA
========================= */

function actualizarCamara() {
    const habitacion = detectarHabitacion();

    let zoom = habitacion ? 1.35 : 1;

    /*
       El buscador tiene una vista más reducida
       durante la búsqueda.
    */
    if (miRol === "buscador" && faseActual === "busqueda") {
        zoom = 2.0;
    }

    const centroX = camara.clientWidth / 2;
    const centroY = camara.clientHeight / 2;

    let izquierda =
        centroX - miJugador.x * zoom;

    let arriba =
        centroY - miJugador.y * zoom;

    const anchoMapa = 1400 * zoom;
    const altoMapa = 900 * zoom;

    izquierda = Math.min(
        0,
        Math.max(
            camara.clientWidth - anchoMapa,
            izquierda
        )
    );

    arriba = Math.min(
        0,
        Math.max(
            camara.clientHeight - altoMapa,
            arriba
        )
    );

    mapa.style.left = izquierda + "px";
    mapa.style.top = arriba + "px";
    mapa.style.transform = `scale(${zoom})`;
}

/* =========================
   HABITACIÓN
========================= */

function detectarHabitacion() {
    const x = miJugador.x;
    const y = miJugador.y;

    if (x >= 64 && x <= 386 && y >= 64 && y <= 336)
        return "Sala de estar";

    if (x >= 539 && x <= 861 && y >= 64 && y <= 336)
        return "Cocina";

    if (x >= 1064 && x <= 1336 && y >= 64 && y <= 336)
        return "Dormitorio";

    if (x >= 64 && x <= 386 && y >= 514 && y <= 836)
        return "Biblioteca";

    if (x >= 539 && x <= 861 && y >= 514 && y <= 836)
        return "Sala central";

    if (x >= 1064 && x <= 1336 && y >= 514 && y <= 836)
        return "Sala de juegos";

    return null;
}

function actualizarHabitacion() {
    const habitacion = detectarHabitacion();

    habitacionActual.textContent =
        habitacion
            ? "Habitación: " + habitacion
            : "Pasillo";
}

/* =========================
   RESULTADO
========================= */

function mostrarResultado(estado) {
    if (partidaTerminada) return;

    partidaTerminada = true;
    detenerMusica();

    tituloResultado.textContent =
        estado.ganador === "buscador"
            ? "¡EL BUSCADOR GANÓ!"
            : "¡LOS ESCONDIDOS GANARON!";

    textoResultado.textContent =
        estado.mensajeFinal ||
        "La partida terminó.";

    overlayPartida.style.display = "flex";
}

volverMenu.addEventListener("click", () => {
    location.reload();
});

/* =========================
   INICIAR
========================= */

actualizarMovimiento();
</script>
